<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跨境指挥台 Commander · 多店铺亚马逊运营中心</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div class="brand-txt"><b>跨境指挥台</b><span>Commander</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="storeStat" class="side-stat"></div>
      <button id="btnToggle" class="btn-ghost">收起导航</button>
    </div>
  </aside>
  <div id="sideOverlay" class="side-overlay"></div>

  <main id="main">
    <header id="topbar">
      <div class="top-left">
        <button id="btnMenu" class="btn-ghost mobile-only">菜单</button>
        <h1 id="pageTitle">店铺总览</h1>
      </div>
      <div id="filters" class="top-filters">
        <label class="fld">
          <span>店铺</span>
          <button id="fStore" class="mini" style="max-width:160px">全部店铺</button>
        </label>
        <label class="fld">
          <span>站点</span>
          <select id="fSite" class="mini">
            <option value="ALL">全部</option>
            <option value="US">US 美国</option>
            <option value="EU">EU 欧洲</option>
            <option value="JP">JP 日本</option>
          </select>
        </label>
        <label class="fld">
          <span>起始</span>
          <input type="date" id="fFrom" class="mini">
        </label>
        <label class="fld">
          <span>结束</span>
          <input type="date" id="fTo" class="mini">
        </label>
        <button id="btnResetFilter" class="btn-ghost">重置</button>
      </div>
    </header>
    <section id="content"></section>
    <footer id="pagefoot">
      数据为手动录入或本地 CSV 导入，仅保存在本浏览器 IndexedDB，系统不做任何自动抓取或 API 调用。
    </footer>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="vendor/echarts.min.js"></script>
<script src="vendor/sheetjs/xlsx.full.min.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/mod-command.js"></script>
<script src="js/mod-operate.js"></script>
<script src="js/mod-assets.js"></script>
<script src="js/mod-product-dev.js"></script>
<script src="js/app.js"></script>
</body>
</html>
