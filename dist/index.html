    U.clearCharts();
    const stores=await sm2(); const PM=await pm();
    const rows=(await DB.all('kpi_daily')).filter(r=>App.inScope(r.storeId))
      .sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0)).slice(0,60);
    root.innerHTML=
      `<div class="card"><h3>每日数据录入</h3>
        <div class="sub">没有 API、不抓取，数据靠后台导出 CSV 或这里手动录入。建议固定每天同一时间录 8 个核心字段</div>
        <div class="toolbar"><button class="btn" id="kAdd">录入今日数据</button>
          <button class="btn-ghost" id="kCsv">导出 CSV</button></div>`+
      U.table({cols:[
        {t:'日期',k:'date'},
        {t:'店铺',f:r=>U.esc(stores[r.storeId]?stores[r.storeId].name:'—')},
        {t:'产品',f:r=>U.esc(PM[r.productId]?PM[r.productId].sku:'全店')},
        {t:'会话',k:'sessions',num:true},{t:'订单',k:'orders',num:true},
        {t:'销售额',num:true,f:r=>U.money(r.sales)},
        {t:'转化率',num:true,f:r=>U.pct(r.cvr)},
        {t:'广告花费',num:true,f:r=>U.money(r.adSpend)},
        {t:'ACOS',num:true,f:r=>U.pct(r.acos)},
        {t:'退款单',k:'refunds',num:true}
      ],rows,empty:'暂无每日数据，点击「录入今日数据」或从「数据导入」导入后台报告',
      actions:r=>`<button class="btn-ghost btn-sm" data-kd="${r.id}">删除</button>`})+`</div>
      <div class="card"><h3>近 30 天销售趋势</h3><div id="cK" class="chart"></div></div>`;
    async function sm2(){const ss=await DB.all('stores');const m={};ss.forEach(s=>m[s.id]=s);return m}
    root.querySelector('#kAdd').onclick=()=>{
      const ss=Object.values(stores);
      U.modal({title:'录入每日数据',body:U.formFields([
        {k:'storeId',t:'店铺',type:'select',opts:ss.map(s=>({v:s.id,t:s.name}))},
        {k:'productId',t:'产品',type:'select',opts:[{v:'',t:'全店合计'}].concat(Object.values(PM).map(p=>({v:p.id,t:p.sku})))},
        {k:'date',t:'日期',type:'date',def:U.today()},
        {k:'sessions',t:'会话 Sessions',type:'number'},{k:'orders',t:'订单数',type:'number'},
        {k:'sales',t:'销售额',type:'number',step:'0.01'},{k:'adSpend',t:'广告花费',type:'number',step:'0.01'},
        {k:'adSales',t:'广告销售',type:'number',step:'0.01'},{k:'refunds',t:'退款单数',type:'number'}
      ]),onOk:async b=>{
        const v=U.formValues(b);
        if(v.productId==='') delete v.productId;
        v.cvr=(v.sessions&&v.orders)?+(v.orders/v.sessions*100).toFixed(2):null;
        v.aov=(v.orders&&v.sales)?+(v.sales/v.orders).toFixed(2):null;
        v.acos=(v.adSales)?+(v.adSpend/v.adSales*100).toFixed(2):null;
        v.refundRate=(v.orders&&v.refunds!=null)?+(v.refunds/v.orders*100).toFixed(2):null;
        await DB.put('kpi_daily',v); U.toast('已保存');
      },after:()=>App.refresh()});
    };
    root.querySelector('#kCsv').onclick=()=>U.exportCSV('commander_kpi.csv',
      rows.map(r=>({日期:r.date,店铺:stores[r.storeId]?stores[r.storeId].name:'',产品:PM[r.productId]?PM[r.productId].sku:'全店',
        会话:r.sessions,订单:r.orders,销售额:r.sales,转化率:r.cvr,广告花费:r.adSpend,ACOS:r.acos,退款:r.refunds})),
      ['日期','店铺','产品','会话','订单','销售额','转化率','广告花费','ACOS','退款']);
    root.querySelectorAll('[data-kd]').forEach(x=>x.onclick=()=>U.confirmBox('删除该记录？',
      async()=>{await DB.del('kpi_daily',Number(x.dataset.kd));App.refresh()}));
    const by={}; rows.forEach(r=>{by[r.date]=(by[r.date]||0)+(Number(r.sales)||0)});
    const ds=Object.keys(by).sort();
    U.chart(document.getElementById('cK'),{
      tooltip:{trigger:'axis'},grid:{left:60,right:20,top:20,bottom:30},
      xAxis:{type:'category',data:ds},yAxis:{type:'value'},
      series:[{type:'line',smooth:true,data:ds.map(d=>+by[d].toFixed(2)),itemStyle:{color:'#1E5FA8'},areaStyle:{color:'#CFE0F2'}}]
    });
  };

  /* ============ 16. 选品立项 ============ */
  const DIMS=[
    {k:'mktSize',t:'市场规模',w:.2},{k:'compete',t:'竞争度',w:.15},
    {k:'priceBand',t:'价格带',w:.15},{k:'margin',t:'毛利空间',w:.2},
    {k:'compliance',t:'合规风险',w:.15},{k:'supply',t:'供应链',w:.15}
  ];
  P.selection=async root=>{
    const rows=await DB.all('candidates');
    rows.forEach(r=>{
      r._score=DIMS.reduce((a,d)=>a+(Number(r[d.k])||0)*d.w,0)*10;
      r._adv=r._score>=75?'优先打爆':(r._score>=55?'可上架':'观望');
    });
    rows.sort((a,b)=>b._score-a._score);
    root.innerHTML=`<div class="card"><h3>选品立项评分卡</h3>
      <div class="sub">六维手动打分（1-10）加权：市场 .2 / 竞争 .15 / 价格带 .15 / 毛利 .2 / 合规 .15 / 供应链 .15。
        系统只排序，立项判断由你做</div>
      <div class="toolbar"><button class="btn" id="cAdd">新增候选</button></div>`+
      U.table({cols:[
        {t:'候选品',k:'name'},{t:'站点',k:'site'},{t:'类目',k:'category'},
        {t:'综合分',num:true,f:r=>r._score.toFixed(1)},
        {t:'建议',f:r=>U.tag(r._adv,r._adv==='优先打爆'?'green':(r._adv==='可上架'?'yellow':'gray'))},
        {t:'备注',k:'note'}
      ],rows,empty:'暂无候选品',
      actions:r=>`<button class="btn-ghost btn-sm" data-e="${r.id}">编辑</button>
        <button class="btn-ghost btn-sm" data-d="${r.id}">删除</button>
        <button class="btn-ghost btn-sm" data-to="${r.id}">转为产品</button>`})+`</div>`;
    const fields=DIMS.map(d=>({k:d.k,t:d.t+' (1-10)',type:'number'})).concat([
      {k:'name',t:'候选品名称'},{k:'site',t:'站点',type:'select',opts:['US','EU','JP'].map(v=>({v,t:v}))},
      {k:'category',t:'类目'},{k:'note',t:'备注',type:'textarea'}]);
    root.querySelector('#cAdd').onclick=()=>U.modal({title:'新增候选品',body:U.formFields(fields),
      onOk:async b=>{await DB.put('candidates',U.formValues(b))},after:()=>App.refresh()});
    root.querySelectorAll('[data-e]').forEach(x=>x.onclick=async()=>{
      const c=await DB.get('candidates',Number(x.dataset.e));
      U.modal({title:'编辑候选品',body:U.formFields(fields,c),onOk:async b=>{
        const v=U.formValues(b);v.id=c.id;await DB.put('candidates',v)},after:()=>App.refresh()});
    });
    root.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>U.confirmBox('删除该候选？',
      async()=>{await DB.del('candidates',Number(x.dataset.d));App.refresh()}));
    root.querySelectorAll('[data-to]').forEach(x=>x.onclick=async()=>{
      const c=await DB.get('candidates',Number(x.dataset.to));
      const stores=await DB.all('stores');
      if(!stores.length){U.toast('请先添加店铺');return}
      await DB.put('products',{storeId:stores[0].id,asin:c.asin||'',sku:(c.name||'').slice(0,12)||'NEW',
        name:c.name,category:c.category,price:0,
        cost:{purchase:0,firstLeg:0,fbaFee:0,commission:.15,storage:0,returnLoss:.05,targetAcos:.25}});
      U.toast('已转为产品，请补全成本结构'); App.go('products');
    });
  };

  /* ============ 17. 竞品追踪 ============ */
  P.competitors=async root=>{
    U.clearCharts();
    const rows=(await DB.all('competitors')).sort((a,b)=>a.date<b.date?1:-1);
    const byAsin={}; rows.forEach(r=>{byAsin[r.asin]=byAsin[r.asin]||[];byAsin[r.asin].push(r)});
    root.innerHTML=`<div class="card"><h3>竞品追踪</h3>
      <div class="sub">手动记录竞品快照（价格 / 评论数 / 排名），形成时间序列。系统不做抓取</div>
      <div class="toolbar"><button class="btn" id="cpAdd">新增快照</button>
        <button class="btn-ghost" id="cpCsv">导出 CSV</button></div>`+
      U.table({cols:[
        {t:'ASIN',k:'asin'},{t:'名称',k:'name'},{t:'日期',k:'date'},
        {t:'价格',num:true,f:r=>U.money(r.price)},{t:'评论数',k:'reviews',num:true},
        {t:'BSR',k:'bsr',num:true},{t:'评分',k:'rating',num:true},{t:'备注',k:'note'}
      ],rows:rows.slice(0,80),empty:'暂无竞品快照',
      actions:r=>`<button class="btn-ghost btn-sm" data-cd="${r.id}">删除</button>`})+`</div>
      <div class="card"><h3>竞品价格走势</h3><div id="cCp" class="chart"></div></div>`;
    root.querySelector('#cpAdd').onclick=()=>U.modal({title:'新增竞品快照',body:U.formFields([
      {k:'asin',t:'ASIN'},{k:'name',t:'名称'},{k:'date',t:'日期',type:'date',def:U.today()},
      {k:'price',t:'价格',type:'number',step:'0.01'},{k:'reviews',t:'评论数',type:'number'},
      {k:'bsr',t:'BSR 排名',type:'number'},{k:'rating',t:'评分',type:'number',step:'0.1'},
      {k:'note',t:'备注'}
    ]),onOk:async b=>{await DB.put('competitors',U.formValues(b))},after:()=>App.refresh()});
    root.querySelector('#cpCsv').onclick=()=>U.exportCSV('commander_competitors.csv',
      rows.map(r=>({ASIN:r.asin,名称:r.name,日期:r.date,价格:r.price,评论数:r.reviews,BSR:r.bsr,评分:r.rating})),
      ['ASIN','名称','日期','价格','评论数','BSR','评分']);
    root.querySelectorAll('[data-cd]').forEach(x=>x.onclick=()=>U.confirmBox('删除该快照？',
      async()=>{await DB.del('competitors',Number(x.dataset.cd));App.refresh()}));
    const asins=Object.keys(byAsin).slice(0,5);
    const dates=Array.from(new Set(rows.map(r=>r.date))).sort();
    U.chart(document.getElementById('cCp'),{
      tooltip:{trigger:'axis'},legend:{top:0},grid:{left:60,right:20,top:30,bottom:30},
      xAxis:{type:'category',data:dates},yAxis:{type:'value'},
      series:asins.map(a=>({name:a,type:'line',smooth:true,
        data:dates.map(d=>{const r=byAsin[a].find(x=>x.date===d);return r?Number(r.price):null})}))
    });
  };

  /* ============ 18. 关键词词库 ============ */
  P.keywords=async root=>{
    const rows=(await DB.all('keywords')).filter(k=>k.kind==='关键词'||!k.kind);
    root.innerHTML=`<div class="card"><h3>关键词词库</h3>
      <div class="sub">手动沉淀核心词、长尾词与否定词；Listing 与广告共用同一词库</div>
      <div class="toolbar"><button class="btn" id="kwAdd">新增关键词</button>
        <button class="btn-ghost" id="kwCsv">导出 CSV</button></div>`+
      U.table({cols:[
        {t:'词',k:'term'},{t:'站点',k:'site'},
        {t:'类型',f:r=>U.tag(r.type||'核心词',(r.type==='否定词')?'red':((r.type==='长尾词')?'yellow':'green'))},
        {t:'月搜索量',k:'volume',num:true},
        {t:'当前排名',k:'rank',num:true},
        {t:'用途',f:r=>U.esc(r.usage||'')}
      ],rows,empty:'暂无关键词',
      actions:r=>`<button class="btn-ghost btn-sm" data-kwd="${r.id}">删除</button>`})+`</div>
      <div class="card"><h3>词库使用建议</h3>
        <div style="font-size:13px;line-height:1.9;color:var(--ink2)">
          核心词放标题前 80 字符与五点首句；长尾词放 Search Terms 与手动精准广告<br>
          否定词持续从搜索词报告里沉淀，高花费零转化的词及时否定<br>
          机器翻译的关键词会偏离真实搜索习惯，务必用母语习惯词
        </div></div>`;
    root.querySelector('#kwAdd').onclick=()=>U.modal({title:'新增关键词',body:U.formFields([
      {k:'term',t:'词'},{k:'site',t:'站点',type:'select',opts:['US','EU','JP'].map(v=>({v,t:v}))},
      {k:'type',t:'类型',type:'select',opts:['核心词','长尾词','否定词'].map(v=>({v,t:v}))},
      {k:'volume',t:'月搜索量',type:'number'},{k:'rank',t:'当前排名',type:'number'},
      {k:'usage',t:'用途',ph:'标题/五点/ST/广告'}
    ],{kind:'关键词'}),onOk:async b=>{const v=U.formValues(b);v.kind='关键词';await DB.put('keywords',v)},
      after:()=>App.refresh()});
    root.querySelector('#kwCsv').onclick=()=>U.exportCSV('commander_keywords.csv',
      rows.map(r=>({词:r.term,站点:r.site,类型:r.type||'核心词',月搜索量:r.volume,排名:r.rank,用途:r.usage})),
      ['词','站点','类型','月搜索量','排名','用途']);
    root.querySelectorAll('[data-kwd]').forEach(x=>x.onclick=()=>U.confirmBox('删除该关键词？',
      async()=>{await DB.del('keywords',Number(x.dataset.kwd));App.refresh()}));
  };

  /* ============ 19. 合规中心 ============ */
  P.compliance=async root=>{
    const stores=await DB.all('stores'); const sm={}; stores.forEach(s=>sm[s.id]=s);
    const rows=(await DB.all('compliance')).filter(c=>App.inScope(c.storeId));
    rows.forEach(r=>{ r._d=U.diffDays(r.expireDate,U.today());
      r._lv=r._d<0?'red':(r._d<=(Number(r.reminderDays)||30)?'yellow':'green'); });
    rows.sort((a,b)=>a._d-b._d);
    root.innerHTML=`<div class="card"><h3>认证 / 税号 / 商标台账</h3>
      <div class="sub">合规是活下来的前提：无认证上架意味着下架 + 罚款风险；到期前自动进入异常提醒</div>
      <div class="toolbar"><button class="btn" id="cmAdd">新增条目</button>
        <button class="btn-ghost" id="cmCsv">导出 CSV</button></div>`+
      U.table({cols:[
        {t:'条目',k:'item'},{t:'类型',k:'type'},{t:'地区',k:'region'},
        {t:'店铺',f:r=>U.esc(sm[r.storeId]?sm[r.storeId].name:'—')},
        {t:'到期日',k:'expireDate'},
        {t:'剩余',num:true,f:r=>r._d<0?('已过期 '+(-r._d)+' 天'):(r._d+' 天')+' '+U.dot(r._lv)},
        {t:'状态',f:r=>U.esc(r.status||'—')}
      ],rows,empty:'暂无合规条目',
      actions:r=>`<button class="btn-ghost btn-sm" data-e="${r.id}">编辑</button>
        <button class="btn-ghost btn-sm" data-d="${r.id}">删除</button>`})+`</div>
      <div class="card"><h3>政策提醒与检查清单</h3>
        <div style="font-size:13px;line-height:1.9;color:var(--ink2)">
          欧洲站：CE 认证、WEEE 注册、德国包装法、VAT（IOSS/OSS）缺一不可<br>
          美国站：各州 Sales Tax 经济关联判定、FCC（电子类）、CPC（儿童类）、FDA（食品化妆品）<br>
          日本站：PSE（电器）、食品卫生法、JCT 合规发票<br>
          通用红线：绝不刷评、不跟卖品牌、不用未授权图片与商标；侵权与操纵评论直接封号
        </div></div>`;
    const fields=[{k:'item',t:'条目名称'},
      {k:'type',t:'类型',type:'select',opts:['认证','税号','商标','政策','其他'].map(v=>({v,t:v}))},
      {k:'region',t:'地区',type:'select',opts:['US','EU','JP','UK','全球'].map(v=>({v,t:v}))},
      {k:'storeId',t:'店铺',type:'select',opts:stores.map(s=>({v:s.id,t:s.name}))},
      {k:'expireDate',t:'到期日',type:'date'},{k:'reminderDays',t:'提前提醒天数',type:'number',def:30},
      {k:'status',t:'状态',type:'select',opts:['有效','办理中','已过期'].map(v=>({v,t:v}))}];
    root.querySelector('#cmAdd').onclick=()=>U.modal({title:'新增合规条目',body:U.formFields(fields),
      onOk:async b=>{await DB.put('compliance',U.formValues(b))},after:()=>App.refresh()});
    root.querySelector('#cmCsv').onclick=()=>U.exportCSV('commander_compliance.csv',
      rows.map(r=>({条目:r.item,类型:r.type,地区:r.region,店铺:sm[r.storeId]?sm[r.storeId].name:'',
        到期日:r.expireDate,剩余天数:r._d,状态:r.status})),['条目','类型','地区','店铺','到期日','剩余天数','状态']);
    root.querySelectorAll('[data-e]').forEach(x=>x.onclick=async()=>{
      const c=await DB.get('compliance',Number(x.dataset.e));
      U.modal({title:'编辑合规条目',body:U.formFields(fields,c),onOk:async b=>{
        const v=U.formValues(b);v.id=c.id;await DB.put('compliance',v)},after:()=>App.refresh()});
    });
    root.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>U.confirmBox('删除该条目？',
      async()=>{await DB.del('compliance',Number(x.dataset.d));App.refresh()}));
  };

  /* ============ 20. 数据与备份 ============ */
  P.data=async root=>{
    const counts={}; let total=0;
    for(const t of window.DB_TABLES){ const c=await DB.count(t); counts[t]=c; total+=c }
    const lastBackup=await DB.getSetting('lastBackup',null);
    root.innerHTML=
      U.kpi([
        {label:'总记录数',value:String(total)},
        {label:'表数量',value:String(window.DB_TABLES.length)},
        {label:'最近备份',value:lastBackup?lastBackup.slice(0,10):'未备份',level:lastBackup?'':'warn'}
      ])+
      `<div class="card"><h3>备份与恢复</h3>
        <div class="sub">数据只存在本机浏览器 IndexedDB；换电脑、清缓存前务必导出 JSON</div>
        <div class="toolbar">
          <button class="btn" id="bExp">导出全库 JSON</button>
          <button class="btn-ghost" id="bImp">导入 JSON（合并）</button>
          <button class="btn-ghost" id="bRep">导入 JSON（覆盖）</button>
          <button class="btn-ghost" id="bSeed">重置为演示数据</button>
          <button class="btn-danger" id="bClr">清空全部数据</button>
        </div>
        <div id="bInfo"></div>
      </div>
      <div class="card"><h3>各表记录数</h3>`+
      U.table({cols:[{t:'表',k:'t'},{t:'记录数',k:'c',num:true}],
        rows:window.DB_TABLES.map(t=>({t,c:counts[t]})),empty:''})+`</div>
      <div class="card"><h3>数据字典</h3>
        <div style="font-size:13px;line-height:1.9;color:var(--ink2)">
          stores 店铺 / products 产品与成本底座 / kpi_daily 每日 KPI / listings Listing 档案 / reviews 评论<br>
          ads 广告活动 / searchterms 搜索词 / inventory 库存 / ship_plans 入仓计划 / returns 退货 / claims 索赔<br>
          promos 促销 / compliance 合规 / nodes 旺季节点 / tasks 待办事项 / diagnosis_log 诊断记录<br>
          competitors 竞品快照 / keywords 关键词与素材 / candidates 选品候选 / patrol 巡店记录
        </div></div>`;
    root.querySelector('#bExp').onclick=async()=>{
      const obj=await DB.exportAll();
      U.download(`commander_backup_${U.today()}.json`,JSON.stringify(obj,null,2),'application/json');
      await DB.setSetting('lastBackup',new Date().toISOString()); U.toast('已导出'); App.refresh();
    };
    const doImport=(mode)=>{
      const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
      inp.onchange=async()=>{
        const f=inp.files[0]; if(!f) return;
        const txt=await f.text();
        try{
          await DB.importAll(JSON.parse(txt),mode);
          U.toast('导入完成'); App.refresh();
        }catch(e){U.toast('导入失败：'+e.message)}
      };
      inp.click();
    };
    root.querySelector('#bImp').onclick=()=>doImport('merge');
    root.querySelector('#bRep').onclick=()=>U.confirmBox('覆盖导入会清空现有数据，确定？',()=>doImport('replace'));
    root.querySelector('#bSeed').onclick=()=>U.confirmBox('清空现有数据并写入演示数据，确定？',async()=>{
      await DB.clearAll(); await window.DBSeed(); U.toast('已重置'); App.refresh();
    });

<script>
/* js/mod-product-dev.js */
/* Phase 3 batch 1 · 选品开发模块路由页（dev-selection / dev-competitor / dev-profit）
 * 纯前端 SPA：仅 IndexedDB，无后端/无 API/无爬虫。
 * 本文件只搭「数据无关的结构骨架」：导航、Tab 容器、子标签、表格、增删改、导出(XLSX/CSV)、公式字段只读。
 * 业务数字（FBA 202509 费率、头程费率、汇率权威来源、ABA 判定规则）均为可编辑设置 + TODO，不臆造真实数值。
 */
(function(){
  const P={}; const U=window.UI, DB=window.DB;
  const esc=U.esc;
  const num=(v,d)=>{const n=Number(v);return isFinite(n)?n:(d===undefined?null:d);};
  const DEFAULT_RATE=(U.RATES&&U.RATES.USD)?U.RATES.USD:6.71; // B5：默认指向 U.RATES.USD（记录级 rate 字段初始值，不全局硬编码）

  /* ---------- 字段定义辅助 ---------- */
  const F=(k,t,o)=>Object.assign({k,t},o||{});
  const N=(k,t,o)=>F(k,t,Object.assign({type:'number',step:'0.01'},o||{}));   // 数字
  const R=(k,t,o)=>F(k,t,Object.assign({readonly:true,num:true},o||{}));        // 公式只读
  const S=(k,t,opts)=>F(k,t,{type:'select',opts});
  const opt=(v,t)=>({v:v,t:t==null?v:t});
  const URLF=(k,t)=>F(k,t,{type:'text',ph:'图片 URL'});

  /* ---------- 计算公式（已知部分直接实现，待确认部分留 TODO） ---------- */
  const W={mktSize:.2,compete:.15,priceBand:.15,margin:.2,compliance:.15,supply:.15}; // B1 权重（沿用）
  function computeScore(r){
    let s=0; for(const k in W) s+=(num(r[k])||0)*W[k];
    r._score=+(s*10).toFixed(1);
    r._adv=r._score>=75?'优先打爆':(r._score>=55?'可上架':'观望');
  }
  function computeBadRate(r){ r.badRate = r.reviews ? (num(r.badReviews)||0)/num(r.reviews) : null; }

  function computeProfitCheck(r){
    const v=U.profitV2({price:r.price$, purchase:r.purchase$, firstLeg:r.firstLeg$, fbaFee:r.fbaFee$,
      commission:r.commission$, refund:r.refund$, ad:r.ad$, storageOther:r.storageOther$, promo:r.promo$, rate:r.rate});
    r.cost$=v.cost$; r.profit$=v.profit$; r.profitRmb=+v.profitRmb.toFixed(2);
    r.netPct=v.netPct==null?null:+v.netPct.toFixed(2);
    r.breakEvenAcos=v.breakEvenAcos==null?null:+v.breakEvenAcos.toFixed(2);
  }
  function computeCompGross(r){
    const price=num(r.price), purchase=num(r.purchase), firstLeg=num(r.firstLeg),
      fba=num(r.fba), commission=num(r.commission), afterSale=num(r.afterSale);
    const gross=price-purchase-firstLeg-fba-commission-(afterSale||0);
    r.gross=+gross.toFixed(2);
    r.grossPct=price?+(gross/price*100).toFixed(2):null;
  }
  function computeResearchProfit(r){
    const price=num(r.priceUsd)||num(r.priceLocal); if(price==null) return;
    const cost=num(r.costUsd), firstLeg=num(r.firstLeg), fba=num(r.fba), tariff=num(r.tariffUs);
    const comm=price*num(r.commPct,12)/100;
    const gross=price-cost-firstLeg-fba-tariff-comm;
    r.grossUsd=+gross.toFixed(2);
    r.grossPct=+(gross/price*100).toFixed(2);
    // TODO L5: netPct 扣除全年推广费与退款，待用户确认口径后校准
    const promo=num(r.promoYear), refund=num(r.refundPct);
    r.netPct=(promo!=null||refund!=null)?+((gross-(promo||0)-(refund||0))/price*100).toFixed(2):null;
  }
  function computeDevUsFba(r){
    const priceUsd=num(r.price$), rate=num(r.rate,DEFAULT_RATE); if(priceUsd==null) return;
    const salesRmb=priceUsd*rate;
    const fba=num(r.fbaWeight$)+num(r.fbaHandling$)+num(r.fbaPick$);
    const comm=priceUsd*num(r.commPct,15)/100;
    const gross=salesRmb-num(r.purchaseRmb)-num(r.firstLegRmb)-fba-comm;
    r.grossRmb=+gross.toFixed(2);
    r.grossPct=salesRmb?+(gross/salesRmb*100).toFixed(2):null;
  }
  function computeDevGross(r){
    const price=num(r.price); if(price==null) return;
    const buy=num(r.buyPrice)||num(r.costRmb); // 前台/后台：售价 - 采购价 占位（精确口径待确认）
    const gross=price-buy; r.gross=+gross.toFixed(2);
    r.grossPct=price?+(gross/price*100).toFixed(2):null;
  }
  // L4 选品利润指标——按利润预估表2.0 口径对齐：commissionRmb=平台佣金$×汇率；amzShipRmb=FBA配送费$×汇率；taxRmb=关税$×汇率；netReceive=售价−佣金−FBA−预扣(广告+退货)。仓储其他/其他促销 模板有但 L4 暂未单列
  function computeProfitMetrics(r){
    // 汇率：记录级可编辑；未填时按货币从 U.RATES 取默认（USD 兜底 DEFAULT_RATE）
    if(r.rate==null || r.rate===''){
      const code={'美元':'USD','英镑':'GBP','欧元':'EUR','加元':'CAD','墨西哥比索':'MXN','日元':'JPY'}[r.currency];
      r.rate=(code && U.RATES && U.RATES[code]!=null) ? U.RATES[code] : DEFAULT_RATE;
    }
    const rate=num(r.rate,DEFAULT_RATE);
    const priceRmb=num(r.price)*rate;
    // 头程：未填 firstLegRmb 时，按渠道 × 计费重量（实重与体积重取大）÷6000 由 U.firstLegCost 估算
    if(r.firstLegRmb==null || r.firstLegRmb===''){
      const realKg=num(r.weightG)/1000;
      const vl=num(r.volL), vw=num(r.volW), vh=num(r.volH);
      const volKg=(vl&&vw&&vh)?U.volWeight(vl,vw,vh,6000):0;
      const chgKg=Math.max(realKg, volKg);
      const ch={'空运':'air','专线':'seaExpress','海运':'seaExpress','铁运':'seaTruck','卡航':'seaTruck'}[r.channel]||'seaExpress';
      r.firstLegRmb=U.firstLegCost(chgKg, ch);
    }
    const firstLeg=num(r.firstLegRmb)||0, cost=num(r.costRmb)||0;
    const preDeduct=num(r.preDeduct); const pd=(preDeduct==null)?priceRmb*(0.07+0.05):preDeduct; // 广告7%+退货5%
    const fx=num(r.fxLoss); const fl=(fx==null)?priceRmb*0.01:fx; // 汇损1% 占位（L4 待确认）
    // —— 按利润预估表2.0 口径补全 L4 四项指标（模板：平台佣金$=售价$×佣金率%；FBA配送费$录入项；模板无税列，税=关税$×汇率）——
    const commPct=num(r.commPct,15);                                  // 平台佣金率%（模板默认15%）
    const commissionRmb=num(r.price)*commPct/100*rate;                 // 平台佣金$ × 汇率
    const fbaFee$=num(r.fbaFee$);                                      // FBA配送费$（模板列G，直接录入）
    const amzShipRmb=(fbaFee$!=null?fbaFee$:0)*rate;                   // 亚马逊配送费￥
    const tariff$=num(r.tariff$);                                       // 关税$（美线进口税；模板无单列，参考 research 表 tariffUs）
    const taxRmb=(tariff$!=null?tariff$:0)*rate;                       // 税/关税￥
    const profit=priceRmb-cost-firstLeg-amzShipRmb-taxRmb-commissionRmb-pd-fl;
    r.priceRmb=+priceRmb.toFixed(2);
    r.commissionRmb=+commissionRmb.toFixed(2);
    r.amzShipRmb=+amzShipRmb.toFixed(2);
    r.taxRmb=+taxRmb.toFixed(2);
    r.preDeduct=+pd.toFixed(2); r.fxLoss=+fl.toFixed(2);
    r.profitRmb=+profit.toFixed(2);
    r.profitRatio=priceRmb?+(profit/priceRmb*100).toFixed(2):null;
    // netReceive 后台到账 = 售价￥ − 佣金￥ − FBA￥ − 预扣(广告+退货)；不含采购/头程/关税/汇损（那些是成本与汇损，已计入 profitRmb）
    r.netReceive=+((priceRmb-commissionRmb-amzShipRmb-pd)).toFixed(2);
  }

  /* ---------- 尺寸/币种解析辅助（供 profit 类 compute 调用 U.* 公式） ---------- */
  // 解析 "30x20x10" / "30×20×10" / "30*20*10" → [l,w,h]（数值，单位保持原样）
  function parseTriple(str){
    if(str==null) return null;
    const m=String(str).split(/[x×*]/).map(s=>Number(s.trim())).filter(n=>isFinite(n)&&n>0);
    return m.length>=3 ? m.slice(0,3) : (m.length===1 ? [m[0],m[0],m[0]] : null);
  }
  const CM2INCH=0.393701;
  // FBA tier 文本（key 或 中文标签 或 旧值'标准'/'大件'/'超大件'）→ 规范 tier key
  function fbaTierKey(val){
    if(!val) return null;
    const FR=U.FBA_RATES; if(!FR) return null;
    const keys={'smallStandard':'smallStandard','largeStandard':'largeStandard','smallBulky':'smallBulky','largeBulky':'largeBulky',
      'oversize-0-50':'oversize-0-50','oversize-50-70':'oversize-50-70','oversize-70-150':'oversize-70-150','oversize-150plus':'oversize-150plus'};
    if(keys[val]) return val;
    const label2key={};
    Object.keys(FR.tiers).forEach(k=>{ if(k!=='oversize') label2key[FR.tiers[k].label]=k; });
    Object.keys(FR.tiers.oversize.bands).forEach(b=>{ label2key[FR.tiers.oversize.bands[b].label]='oversize-'+b; });
    if(label2key[val]) return label2key[val];
    if(val==='标准') return 'largeStandard';     // 旧 seed 值兼容
    if(val==='小号标准') return 'smallStandard';
    if(val==='大件') return 'largeBulky';
    if(val==='超大件') return 'oversize-0-50';
    return null;
  }

  // 1-产品尺寸录入表：头程抛重(÷6000/÷5000) + 输入尺寸自动算 FBA 分段/计费重/配送费（用户亦可在 feeCheck 手填覆盖）
  function computeSize(r){
    // 头程抛重（cm）：优先用包装尺寸，回退产品尺寸
    const cmTriple = parseTriple(r.pkgSizeCm) || parseTriple(r.sizeCm);
    if(cmTriple){
      const v=cmTriple[0]*cmTriple[1]*cmTriple[2];
      r.volDiv6000=+(v/6000).toFixed(3);
      r.volDiv5000=+(v/5000).toFixed(3);
    }
    // FBA 分段/计费重/配送费：由包装 inch 尺寸（pkgSizeCm）+ 包装实重(lb) 自动算
    const pkgCm=parseTriple(r.pkgSizeCm);
    if(pkgCm && r.pkgWeightLb!=null){
      const dims={ l:pkgCm[0]*CM2INCH, w:pkgCm[1]*CM2INCH, h:pkgCm[2]*CM2INCH, weightLb:num(r.pkgWeightLb) };
      const est=U.fbaEstimate(dims, {priceBand:'mid', includeSurcharge:true});
      r.fbaTier=U.fbaTierLabel(est.tier);          // 中文标签，便于阅读
      r.fbaChargeWtLb=est.chargeableLb;            // 计费重量 lb
      r.estFee=est.fee;                            // 预估 FBA 配送费 $（含 3.5% 燃油附加费）
    }
  }
  // 2-配送费预估核对：用户手填 FBA 尺寸分段 + 计费重量 → 自动算预估配送费（fbaRealFee 仍由用户填实际值覆盖）
  function computeFeeCheck(r){
    if(r.fbaTier && r.fbaWeightLb!=null){
      const key=fbaTierKey(r.fbaTier);
      if(key){
        const fee=U.fbaFee(key, num(r.fbaWeightLb), {priceBand:'mid', includeSurcharge:true});
        if(fee!=null) r.estFee=fee;
      }
    }
  }
  // ABA 汇总：录入 q1-q4 后自动判定 trend/capacity/recommend + 无参数统计
  function computeAbaRow(r){
    const res=U.computeAba(r);
    r.trend=res.trend; r.capacity=res.capacity; r.recommend=res.recommend;
    const ranks=[r.rankQ1,r.rankQ2,r.rankQ3,r.rankQ4].map(x=>Number(x));
    r.noParamSum=ranks.filter(x=>isFinite(x)&&x===10000).length; // 无参数(=10000)季度计数
  }

            <button class="btn-ghost btn-sm" data-d="${r.id}">删除</button>`})+

          onOk:async b=>{ let v=U.formValues(b); if(cfg.pack) v=cfg.pack(v);
            if(cfg.sheet) v.sheet=cfg.sheet; if(cfg.compute) cfg.compute(v);
            await DB.put(cfg.store,v); U.toast('已保存'); },after:draw});
      };
      bodyEl.querySelector('#expX').onclick=()=>{
        const exRows=rows.map(r=>{const o={}; headers.forEach(h=>o[h.key]=r[h.key]); return o;});
        U.exportXLSX((cfg.xlsxName||cfg.label||cfg.title||'export')+'.xlsx',
          [{name:(cfg.label||cfg.title||'Sheet').slice(0,31),rows:exRows,headers}]);
      };
      bodyEl.querySelector('#expC').onclick=()=>{
        const exRows=rows.map(r=>{const o={}; headers.forEach(h=>o[h.key]=r[h.key]); return o;});
        U.exportCSV((cfg.xlsxName||cfg.label||cfg.title||'export')+'.csv',exRows,headers.map(h=>h.label));
      };
      bodyEl.querySelectorAll('[data-e]').forEach(x=>x.onclick=async()=>{
        const rec=await DB.get(cfg.store,Number(x.dataset.e)); if(cfg.compute) cfg.compute(rec);
        U.modal({title:cfg.editTitle||('编辑 · '+(cfg.title||cfg.label)),body:U.formFields(cfg.fields,rec),
          onOk:async b=>{ let v=U.formValues(b); v.id=rec.id; if(cfg.pack) v=cfg.pack(v);
            if(cfg.sheet) v.sheet=cfg.sheet; if(cfg.compute) cfg.compute(v);
            await DB.put(cfg.store,v); U.toast('已保存'); },after:draw});
      });

        async()=>{ await DB.del(cfg.store,Number(x.dataset.d)); draw(); }));
    }
    draw();
  }

    const subBody=bodyEl.querySelector('.sub-body');

      subBody.innerHTML='<div class="empty">加载中…</div>';
      let rows=await DB.all(cfg.store);
      if(cfg.sheet) rows=rows.filter(r=>r.sheet===cfg.sheet);
      rows.forEach(r=>cfg.compute&&cfg.compute(r));

      subBody.innerHTML=U.table({cols,rows,empty:cfg.empty||'暂无数据',

        U.modal({title:cfg.editTitle||('编辑 · '+cfg.label),body:U.formFields(cfg.fields,rec),
          onOk:async b=>{ let v=U.formValues(b); v.id=rec.id; if(cfg.sheet) v.sheet=cfg.sheet;
            if(cfg.compute) cfg.compute(v); await DB.put(cfg.store,v); U.toast('已保存'); },after:()=>drawSheet(cfg)});
      });
      subBody.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>U.confirmBox('删除该记录？',
        async()=>{ await DB.del(cfg.store,Number(x.dataset.d)); drawSheet(cfg); }));
    }
    const curCfg=()=>sheetCfgs.find(s=>s.key===cur);
    bodyEl.querySelector('#addBtn').onclick=()=>{
      const cfg=curCfg(); const v0={}; if(cfg.sheet) v0.sheet=cfg.sheet;
      U.modal({title:'新增 · '+cfg.label,body:U.formFields(cfg.fields,v0),
        onOk:async b=>{ let v=U.formValues(b); if(cfg.sheet) v.sheet=cfg.sheet; if(cfg.compute) cfg.compute(v);
          await DB.put(cfg.store,v); U.toast('已保存'); },after:()=>drawSheet(cfg)});
    };
    bodyEl.querySelector('#expX').onclick=async()=>{
      const sheets=[];
      for(const cfg of sheetCfgs){
        let rows=await DB.all(cfg.store);
        if(cfg.sheet) rows=rows.filter(r=>r.sheet===cfg.sheet);
        rows.forEach(r=>cfg.compute&&cfg.compute(r));
        const headers=cfg.fields.map(f=>({key:f.k,label:f.t}));
        const exRows=rows.map(r=>{const o={}; headers.forEach(h=>o[h.key]=r[h.key]); return o;});
        sheets.push({name:cfg.label.slice(0,31),rows:exRows,headers});
      }
      U.exportXLSX((title||'export')+'.xlsx',sheets);
    };
    bodyEl.querySelector('#expC').onclick=async()=>{
      const cfg=curCfg(); let rows=await DB.all(cfg.store); if(cfg.sheet) rows=rows.filter(r=>r.sheet===cfg.sheet);
      rows.forEach(r=>cfg.compute&&cfg.compute(r));
      const headers=cfg.fields.map(f=>({key:f.k,label:f.t}));
      const exRows=rows.map(r=>{const o={}; headers.forEach(h=>o[h.key]=r[h.key]); return o;});
      U.exportCSV((cfg.xlsxName||cfg.label)+'.csv',exRows,headers.map(h=>h.label));
    };
    U.bindSubTabs(bodyEl, sheetCfgs, subBody, (s,k,b)=>{ cur=k; const cfg=s.find(x=>x.key===k); drawSheet(cfg); });
    drawSheet(curCfg());
  }

<script>
/* js/app.js */
(function(){
  const U=window.UI, DB=window.DB;

  const MENU=[
    {g:'总览工具',items:[
      {k:'dashboard',t:'店铺总览'},
      {k:'risk',t:'风险清单'},
      {k:'diagnosis',t:'诊断中心'},
      {k:'tasks',t:'待办事项'},
      {k:'patrol',t:'每日巡店'},
      {k:'stores',t:'店铺与站点'},
      {k:'toolbox',t:'工具箱',star:1},
      {k:'data',t:'数据与备份'},
      {k:'settings',t:'设置与阈值'}
    ]},
    {g:'选品开发',items:[
      {k:'dev-selection',t:'选品立项&市场调研'},
      {k:'dev-competitor',t:'竞品深度分析'},
      {k:'dev-profit',t:'利润测算&产品开发',star:1}
    ]},
    {g:'推广运营',items:[
      {k:'keywords',t:'关键词词库'},
      {k:'listing',t:'Listing 优化'},
      {k:'ads',t:'广告管理'},
      {k:'newlaunch',t:'新品推广节奏',star:1},
      {k:'peak',t:'大促时间表'}
    ]},
    {g:'库存管理',items:[
      {k:'inventory',t:'库存补货'},
      {k:'purchase',t:'采购记录',star:1},
      {k:'logistics',t:'物流比价',star:1},
      {k:'qc',t:'质检',star:1}
    ]},
    {g:'售后合规',items:[
      {k:'returns',t:'退货与索赔'},
      {k:'appeal',t:'申诉模板',star:1},
      {k:'reply',t:'回复模板',star:1},
      {k:'compliance',t:'合规中心'}
    ]},
    {g:'财务绩效',items:[
      {k:'finance',t:'财务核算',star:1},
      {k:'kpi',t:'每日数据'},
      {k:'kpiscore',t:'KPI 绩效',star:1},
      {k:'team',t:'团队管理',star:1}
    ]}
  ];
  const TITLES={}; MENU.forEach(g=>g.items.forEach(i=>TITLES[i.k]=i.t));

  const App={
    state:{},
    filters:(()=>{const t=U.today(); return {from:U.addDays(t,-364),to:t,site:'ALL',storeIds:[]}})(),
    inScope(storeId){
      const f=App.filters;
      if(f.storeIds&&f.storeIds.length) return f.storeIds.indexOf(storeId)>=0;
      if(f.site&&f.site!=='ALL'){
        const s=App._stores&&App._stores[storeId];
        return !!s&&s.site===f.site;
      }
      return true;
    },
    go(k){ location.hash='#/'+k },
    async refresh(){ await App.render(location.hash.replace('#/','')||'dashboard') }
  };

  const navOpen=new Set();
  function renderNav(active){
    const nav=document.querySelector('#nav');
    const activeG=MENU.find(g=>g.items.some(i=>i.k===active));
    if(activeG) navOpen.add(activeG.g);
    nav.innerHTML=MENU.map(g=>{
      const open=navOpen.has(g.g)?'open':'';
      return `<div class="nav-sec ${open}" data-g="${g.g}">
        <div class="nav-group"><span class="ng-label">${g.g}</span><span class="caret">▸</span></div>
        <div class="nav-sub">`+
        g.items.map(i=>`<div class="nav-item ${i.k===active?'active':''}" data-k="${i.k}">
          <span>${i.t}</span>${i.star?'<span class="dot d-yellow" title="差异化模块"></span>':''}</div>`).join('')+
        `</div></div>`;
    }).join('');
    nav.querySelectorAll('.nav-group').forEach(el=>{
      el.onclick=()=>{
        const sec=el.closest('.nav-sec'); const key=sec.dataset.g;
        if(navOpen.has(key)) navOpen.delete(key); else navOpen.add(key);
        sec.classList.toggle('open');
      };
    });
    nav.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{
      App.go(el.dataset.k);
      document.querySelector('#sidebar').classList.remove('open');
      document.querySelector('#sideOverlay').classList.remove('show');
    });
  }

  async function renderStorePicker(){
    const stores=await DB.all('stores');
    App._stores={}; stores.forEach(s=>App._stores[s.id]=s);
    const box=document.querySelector('#fStore');
    const sel=App.filters.storeIds;
    const label=sel.length?`已选 ${sel.length} 家`:'全部店铺';
    box.textContent=label;
    box.onclick=()=>{
      U.modal({title:'选择店铺（可多选）',
        body:`<div class="store-picker">`+stores.map(s=>
          `<label class="store-picker-item"><input type="checkbox" value="${s.id}" ${sel.indexOf(s.id)>=0?'checked':''}><span>${U.esc(s.name)}</span></label>`).join('')+
          `</div><div style="margin-top:10px;text-align:right"><button class="btn-ghost" id="selAll">全选/清空</button></div>`,
        okText:'应用',
        onOk:b=>{
          const ids=[]; b.querySelectorAll('input[type=checkbox]').forEach(c=>{if(c.checked)ids.push(Number(c.value))});
          App.filters.storeIds=ids; localStorage.setItem('cmdr_stores',JSON.stringify(ids));
          renderStorePicker(); App.refresh(); return true;
        }});
      const m=document.querySelector('#modalRoot');
      const all=m.querySelector('#selAll');
      if(all) all.onclick=()=>{m.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=!c.checked)};
    };
    document.querySelector('#storeStat').innerHTML=
      `共 ${stores.length} 家店铺<br>数据存于本机 IndexedDB`;
  }

  App.render=async function(key){
    if(!TITLES[key]) key='dashboard';
    U.clearCharts();
    renderNav(key);
    document.querySelector('#pageTitle').textContent=TITLES[key]||'';
    const root=document.querySelector('#content');
    root.innerHTML=`<div class="empty">加载中…</div>`;
    try{
      await window.Pages[key](root);
    }catch(e){
      root.innerHTML=`<div class="card"><h3>页面出错了</h3>
        <div style="font-size:13px;color:var(--red);line-height:1.8">${U.esc(e.message)}</div>
        <div style="font-size:12px;color:var(--ink2);margin-top:8px">${U.esc(String(e.stack||'').split('\n')[1]||'')}</div></div>`;
      console.error(e);
    }
    const f=App.filters;
    document.querySelector('#fFrom').value=f.from||'';
    document.querySelector('#fTo').value=f.to||'';
    document.querySelector('#fSite').value=f.site||'ALL';
  };

  async function init(){
    const saved=JSON.parse(localStorage.getItem('cmdr_stores')||'[]');
    App.filters.storeIds=saved;
    const rules=await DB.getSetting('rules',null);
    if(rules) U.setRules(rules);
    await renderStorePicker();
    document.querySelector('#content').innerHTML='<div class="empty">正在初始化演示数据，请稍候…</div>';
    const seeded=await window.DBSeed();
    if(seeded){
      const stores=await DB.all('stores');
      App._stores={}; stores.forEach(s=>App._stores[s.id]=s);
      U.toast('已写入演示数据，可在「数据与备份」一键清除');
    }
    document.querySelector('#fFrom').onchange=e=>{App.filters.from=e.target.value;App.refresh()};
    document.querySelector('#fTo').onchange=e=>{App.filters.to=e.target.value;App.refresh()};
    document.querySelector('#fSite').onchange=e=>{App.filters.site=e.target.value;App.refresh()};
    document.querySelector('#btnResetFilter').onclick=()=>{
      const t=U.today();
      App.filters={from:U.addDays(t,-364),to:t,site:'ALL',storeIds:[]};
      localStorage.setItem('cmdr_stores','[]');
      renderStorePicker(); App.refresh();
    };
    const sbEl=document.querySelector('#sidebar');
    const ovEl=document.querySelector('#sideOverlay');
    const openDrawer=()=>{sbEl.classList.add('open');ovEl.classList.add('show')};
    const closeDrawer=()=>{sbEl.classList.remove('open');ovEl.classList.remove('show')};
    document.querySelector('#btnToggle').onclick=()=>sbEl.classList.toggle('collapsed');
    document.querySelector('#btnMenu').onclick=openDrawer;
    ovEl.onclick=closeDrawer;
    window.addEventListener('hashchange',()=>App.refresh());
    await App.render(location.hash.replace('#/','')||'dashboard');
    window.addEventListener('resize',()=>{
      if(window.echarts) document.querySelectorAll('.chart').forEach(el=>{
        const c=echarts.getInstanceByDom(el); if(c) c.resize();
      });
    });
  }

  window.App=App; window.__CMDR_READY__=true;
  document.addEventListener('DOMContentLoaded',()=>{
    init().catch(e=>{
      document.querySelector('#content').innerHTML=
        `<div class="card"><h3>无法启动</h3>
        <div style="font-size:13px;line-height:1.9;color:var(--red)">${String(e&&e.message||e)}</div>
        <div style="font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.8">
          常见原因：以 file:// 方式直接打开，浏览器禁用了 IndexedDB。<br>
          请用本地服务方式访问，例如在目录下执行：<br>
          <code>python -m http.server 8123</code> 然后打开 http://localhost:8123
        </div></div>`;
      console.error(e);
    });
  });
})();

</script>

<noscript>
  <div style="padding:40px;text-align:center;color:#c00">
    你的浏览器禁用了 JavaScript，本应用无法运行。
  </div>
</noscript>
<script>
  // 5 秒后若主应用仍未标记初始化完成，提示网络/缓存问题
  setTimeout(function(){
    if (!window.__CMDR_READY__) {
      var content = document.getElementById('content');
      if (content && !content.querySelector('.kpi')) {
        content.innerHTML = '<div class="card"><h3>页面加载未完成</h3>' +
          '<div style="font-size:13px;line-height:1.9;color:var(--red)">5 秒内应用未完成初始化，常见原因：</div>' +
          '<ul style="font-size:12px;line-height:1.9;margin-top:8px;padding-left:18px">' +
          '<li>GitHub Pages 在中国大陆部分地区被墙/限流，请尝试开启 VPN/代理后刷新。</li>' +
          '<li>浏览器缓存了旧版本，请按 Ctrl+F5（或 Shift+F5）强制刷新。</li>' +
          '<li>以 file:// 方式直接打开时，部分浏览器会禁用 IndexedDB，请用本地服务访问。</li>' +
          '</ul></div>';
      }
    }
  }, 5000);
</script>
