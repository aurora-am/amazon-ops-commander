<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跨境指挥台 Commander · 多店铺亚马逊运营中心</title>
<style>
/* css/style.css */
:root{
  --bg:#F2F7FC; --card:#FFFFFF; --blue:#1E5FA8; --blue-soft:#E4EEF9;
  --ink:#29313B; --ink2:#5E6E7E; --line:#DBE5F0;
  --red:#C0392B; --yellow:#D4A017; --green:#27AE60; --gray:#9AA8B5;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px}
#app{display:flex;min-height:100vh}

#sidebar{width:230px;flex:0 0 230px;background:#E8F0F9;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px;transition:width .2s;
  position:sticky;top:0;height:100vh;overflow:hidden}
#sidebar.collapsed{width:56px;flex:0 0 56px}
#sidebar.collapsed .brand-txt,#sidebar.collapsed nav,#sidebar.collapsed .side-stat{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 32px}
.brand-txt b{display:block;font-size:15px;color:var(--blue)}
.brand-txt span{font-size:11px;color:var(--ink2)}
nav{flex:1;overflow:auto}
.nav-group{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:8px 0 2px;padding:8px 10px;border-radius:8px;cursor:pointer;user-select:none;
  font-size:12px;font-weight:700;color:var(--blue);letter-spacing:1px}
.nav-group:hover{background:#DCE8F5}
.nav-sec .nav-sub{display:none;padding-left:4px}
.nav-sec.open .nav-sub{display:block}
.caret{font-size:10px;line-height:1;transition:transform .15s ease;color:var(--blue)}
.nav-sec.open .caret{transform:rotate(90deg)}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  cursor:pointer;color:var(--ink);font-size:13px;margin-bottom:2px}
.nav-item:hover{background:#E3EDF7}
.nav-item.active{background:var(--blue);color:#fff}
.nav-item .dot{margin-left:auto;width:8px;height:8px;border-radius:50%}
.side-foot{padding-top:10px;border-top:1px solid var(--line)}
.side-stat{font-size:11px;color:var(--ink2);padding:0 8px 8px;line-height:1.6}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 20px;border-bottom:1px solid var(--line);background:#F5F9FD;flex-wrap:wrap}
#pageTitle{font-size:17px;color:var(--blue);margin:0;font-weight:600}
.top-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fld{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);flex-wrap:nowrap;white-space:nowrap}
.fld>span{flex-shrink:0}
.fld>.mini{min-width:0;flex:1 1 auto}
.mini{border:1px solid var(--line);border-radius:8px;background:#fff;padding:5px 8px;
  color:var(--ink);font-size:12px;max-width:150px}
#content{padding:18px 20px;flex:1}
#pagefoot{padding:10px 20px;font-size:11px;color:var(--ink2);border-top:1px solid var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--blue);font-weight:600}
.card .sub{font-size:12px;color:var(--ink2);margin:-6px 0 10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .k-lab{font-size:12px;color:var(--ink2)}
.kpi .k-val{font-size:20px;font-weight:600;margin:4px 0;color:var(--ink)}
.kpi .k-sub{font-size:11px;color:var(--ink2)}
.kpi.alert{border-color:var(--red);background:#FCEEEC}
.kpi.alert .k-lab,.kpi.alert .k-val{color:var(--red)}
.kpi.warn{border-color:var(--yellow);background:#FDF6E6}
.kpi.warn .k-lab,.kpi.warn .k-val{color:#B8860B}
.kpi.k-empty .k-val{color:var(--gray);font-style:italic}
.kpi.k-empty .k-sub{color:var(--gray)}
.muted{color:var(--gray)}
.t-urgent{color:#fff;background:var(--red);border-color:var(--red)}
.t-high{color:#fff;background:#E67E22;border-color:#E67E22}
.t-mid{color:var(--gray);border-color:var(--gray);background:#EEF2F6}
.stat-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sb-item{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line)}
.sb-urgent{color:var(--red);border-color:var(--red);background:#FBECEA}
.sb-high{color:#E67E22;border-color:#E67E22;background:#FBF0E6}
.sb-mid{color:var(--gray);border-color:var(--gray);background:#EEF2F6}
.sb-total{color:var(--blue);border-color:var(--blue);background:#E4EEF9}
.alert-item{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px;margin-bottom:8px}
.alert-item.lv-red{border-color:var(--red)}
.alert-item.lv-yellow{border-color:var(--yellow)}
.alert-item.lv-gray{border-color:var(--gray)}
.alert-item.expired{opacity:.55}
.ai-main{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ai-text{flex:1;min-width:0;font-size:13px;color:var(--ink);word-break:break-word}
.ai-foot{display:flex;align-items:center;gap:8px;margin-top:7px;padding-left:17px;flex-wrap:wrap}
.ai-count{font-size:11px;color:var(--gray)}
.ai-count.red{color:var(--red);font-weight:600}
.ai-actions{margin-left:auto;display:flex;gap:6px}
.ai-actions .btn-sm[disabled]{opacity:.5;cursor:default}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--blue);font-weight:600;font-size:12px;background:#EFF5FB}
tbody tr:hover{background:#EFF5FB}
td.num,th.num{text-align:right}

.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;
  padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{opacity:.88}
.btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.btn-sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn-danger{background:#fff;color:var(--red);border-color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}

.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;border:1px solid}
.t-red{color:var(--red);border-color:var(--red);background:#FBECEA}
.t-yellow{color:var(--yellow);border-color:var(--yellow);background:#FDF5E2}
.t-green{color:var(--green);border-color:var(--green);background:#EBF7F0}
.t-gray{color:var(--gray);border-color:var(--gray);background:#EEF2F6}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.d-red{background:var(--red)} .d-yellow{background:var(--yellow)}
.d-green{background:var(--green)} .d-gray{background:var(--gray)}

.empty{padding:26px;text-align:center;color:var(--ink2);font-size:13px}
.chart{width:100%;height:260px}

.sop-step{border:1px solid var(--line);border-radius:var(--radius);background:#fff;
  padding:14px;margin-bottom:10px}
.sop-step.done{border-color:var(--green)} .sop-step.bad{border-color:var(--red)}
.sop-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sop-idx{width:26px;height:26px;border-radius:50%;background:var(--blue-soft);
  color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 26px}
ul.check{list-style:none;padding:0;margin:6px 0 0}
ul.check li{padding:4px 0;font-size:13px;color:var(--ink2)}
.bar{height:8px;background:#E3EDF7;border-radius:6px;overflow:hidden;margin:8px 0}
.bar > i{display:block;height:100%;background:var(--blue)}

.node{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:12px}
.node.red{border-color:var(--red)} .node.yellow{border-color:var(--yellow)}
.node.over{opacity:.5}
.node .nd{font-size:18px;font-weight:600;color:var(--blue)}
.heat td{text-align:center;cursor:pointer}

label.f{margin-bottom:10px;font-size:12px;color:var(--ink2)}
input,select,textarea{font-family:inherit;border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-size:13px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px}
#modalRoot .mask{position:fixed;inset:0;z-index:1000;background:rgba(30,55,90,.35);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#modalRoot{position:fixed;inset:0;z-index:1000;pointer-events:none}
#modalRoot .mask{pointer-events:auto}
.modal{background:#fff;border-radius:14px;width:560px;max-width:100%;padding:18px;
  max-height:86vh;overflow:auto}
.modal h3{margin:0 0 12px;color:var(--blue);font-size:15px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toastRoot{position:fixed;top:14px;right:14px;z-index:1100;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:8px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06);font-size:13px}
.mobile-only{display:none}
@media(max-width:900px){
  #sidebar{position:fixed;z-index:50;top:0;left:-260px;width:230px;height:100%;
    box-shadow:0 0 28px rgba(15,45,85,.28);transition:left .25s ease}
  #sidebar.open{left:0}
  .side-overlay{display:none;position:fixed;inset:0;z-index:40;background:rgba(15,40,75,.45)}
  .side-overlay.show{display:block}
  #btnToggle{display:none}
  .mobile-only{display:inline-block}
  .g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:1fr}
}

/* ===== 选品开发模块（Phase 3 增量，沿用科技蓝变量） ===== */
/* Tab 条（页面内一级导航） */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 14px;flex-wrap:wrap}
.tab{padding:8px 14px;cursor:pointer;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--blue)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

/* 子标签（B9 二级，较 Tab 小一号） */
.sub-tabs{display:flex;gap:2px;background:var(--blue-soft);border-radius:8px;padding:3px;margin-bottom:12px;flex-wrap:wrap}
.sub-tab{padding:5px 11px;cursor:pointer;font-size:12px;color:var(--ink2);border-radius:6px}
.sub-tab:hover{color:var(--blue)}
.sub-tab.active{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 3px rgba(30,95,168,.12)}
.sub-body{margin-top:2px}

/* 分区卡（一个 sheet / 一个区块独立成卡） */
.section-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.section-card > h4{margin:0 0 8px;font-size:13px;color:var(--blue)}

/* 图片 URL 字段（=DISPIMG 转 URL） */
.img-field{display:flex;gap:8px;align-items:center}
.img-field img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

/* 公式只读展示 */
.formula-ro{background:#F2F7FC;color:var(--blue);font-weight:600;cursor:not-allowed}
td.formula,.formula{color:var(--blue);font-weight:600}

/* 店铺选择弹窗 */
.store-picker{display:flex;flex-direction:column;gap:4px;font-size:13px}
.store-picker-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .12s}
.store-picker-item:hover{background:#EEF4FB}
.store-picker-item input[type=checkbox]{width:16px;height:16px;margin:0;flex:0 0 16px;cursor:pointer}
.store-picker-item span{flex:1;line-height:1.4;word-break:break-word}


</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div class="brand-txt"><b>跨境指挥台</b><span>Commander</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="storeStat" class="side-stat"></div>
      <button id="btnToggle" class="btn-ghost">收起导航</button>
    </div>
  </aside>
  <div id="sideOverlay" class="side-overlay"></div>

  <main id="main">
    <header id="topbar">
      <div class="top-left">
        <button id="btnMenu" class="btn-ghost mobile-only">菜单</button>
        <h1 id="pageTitle">店铺总览</h1>
      </div>
      <div id="filters" class="top-filters">
        <label class="fld">
          <span>店铺</span>
          <button id="fStore" class="mini" style="max-width:160px">全部店铺</button>
        </label>
        <label class="fld">
          <span>站点</span>
          <select id="fSite" class="mini">
            <option value="ALL">全部</option>
            <option value="US">US 美国</option>
            <option value="EU">EU 欧洲</option>
            <option value="JP">JP 日本</option>
          </select>
        </label>
        <label class="fld">
          <span>起始</span>
          <input type="date" id="fFrom" class="mini">
        </label>
        <label class="fld">
          <span>结束</span>
          <input type="date" id="fTo" class="mini">
        </label>
        <button id="btnResetFilter" class="btn-ghost">重置</button>
      </div>
    </header>
    <section id="content"></section>
    <footer id="pagefoot">
      数据为手动录入或本地 CSV 导入，仅保存在本浏览器 IndexedDB，系统不做任何自动抓取或 API 调用。
    </footer>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="vendor/echarts.min.js?v=2"></script>
<script src="vendor/sheetjs/xlsx.full.min.js?v=2"></script>
<script>
/* js/db.js */
(function(){
  const DB_NAME='commander_db';
  const DB_VER=5;
  const TABLES=['stores','products','kpi_daily','listings','reviews','ads','searchterms',
    'inventory','ship_plans','returns','claims','promos','compliance','nodes','tasks',
    'diagnosis_log','competitors','keywords','candidates','patrol','settings','snapshots',
    'newlaunch','purchase','logistics','qc','appeal','reply','influencer','finance',
    'kpi_score','team','toolbox','account_health',
    'project_progress','market_analysis','aba_keywords','research',
    'competitor_basic','competitor_multi','competitor_plan',
    'profit_check','profit_metrics','product_analysis','dev_plan','fba_rate'];

  let _db=null;
  function open(){
    return new Promise((res,rej)=>{
      if(_db) return res(_db);
      const rq=indexedDB.open(DB_NAME,DB_VER);
      rq.onupgradeneeded=e=>{
        const db=e.target.result;
        TABLES.forEach(t=>{
          if(!db.objectStoreNames.contains(t)){
            const kp=(t==='settings')?'key':'id';
            db.createObjectStore(t,{keyPath:kp,autoIncrement:(kp==='id')});
          }
        });
      };
      rq.onsuccess=e=>{_db=e.target.result;res(_db)};
      rq.onerror=e=>rej(e);
    });
  }
  function tx(store,mode){
    return open().then(db=>db.transaction(store,mode).objectStore(store));
  }
  function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

  const DB={
    all:store=>tx(store,'readonly').then(os=>req(os.getAll())),
    get:(store,id)=>tx(store,'readonly').then(os=>req(os.get(id))),
    put:(store,obj)=>{
      // B4 防御：拒绝写入含刷单/测评中介语义字段的对象（仅校验键名，不影响正常业务字段）
      if(obj&&typeof obj==='object'&&!Array.isArray(obj)){
        const bad=Object.keys(obj).some(k=>/shua|刷单|测评中介/.test(k));
        if(bad){
          console.warn('[DB] 拒绝写入含刷单/测评中介字段的对象到 store=',store,obj);
          if(window.UI&&window.UI.toast) window.UI.toast('检测到非法字段（刷单/测评），已拒绝写入');
          return Promise.resolve(null);
        }
      }
      return tx(store,'readwrite').then(os=>req(os.put(obj)));
    },
    del:(store,id)=>tx(store,'readwrite').then(os=>req(os.delete(id))),
    bulk:(store,arr)=>tx(store,'readwrite').then(os=>{
      arr.forEach(o=>os.put(o)); return new Promise(r=>{os.transaction.oncomplete=()=>r(true)});
    }),
    clear:store=>tx(store,'readwrite').then(os=>req(os.clear())),
    clearAll:()=>Promise.all(TABLES.map(t=>DB.clear(t))),
    count:store=>tx(store,'readonly').then(os=>req(os.count())),
    setSetting:(k,v)=>DB.put('settings',{key:k,value:v}),
    getSetting:(k,d)=>DB.get('settings',k).then(r=>r?r.value:d),
    async exportAll(){
      const out={_app:'commander',_ver:1,_at:new Date().toISOString(),data:{}};
      for(const t of TABLES){ out.data[t]=await DB.all(t); }
      return out;
    },
    async importAll(obj,mode){
      if(!obj||!obj.data) throw new Error('文件格式不正确');
      for(const t of TABLES){
        const rows=obj.data[t]||[];
        if(mode==='replace') await DB.clear(t);
        await DB.bulk(t,rows);
      }
      return true;
    }
  };

  /* ---------- 旺季节点库（三站点） ---------- */
  const NODE_TPL={
    US:[
      {n:'春季会员日',d:'03-25',off:{提报:-45,早鸟:-35,入仓:-21,开卖:0}},
      {n:'Prime Day',d:'07-15',off:{提报:-60,早鸟:-45,入仓:-30,开卖:0}},
      {n:'秋季会员日',d:'10-10',off:{提报:-50,早鸟:-40,入仓:-25,开卖:0}},
      {n:'黑五网一',d:'11-28',off:{提报:-70,早鸟:-55,入仓:-35,开卖:0}},
      {n:'圣诞季',d:'12-18',off:{提报:-40,早鸟:-30,入仓:-25,开卖:0}}
    ],
    EU:[
      {n:'春季促销',d:'04-01',off:{提报:-45,早鸟:-35,入仓:-21,开卖:0}},
      {n:'Prime Day',d:'07-15',off:{提报:-60,早鸟:-45,入仓:-30,开卖:0}},
      {n:'黑五网一',d:'11-28',off:{提报:-70,早鸟:-55,入仓:-35,开卖:0}},
      {n:'圣诞季',d:'12-18',off:{提报:-40,早鸟:-30,入仓:-25,开卖:0}}
    ],
    JP:[
      {n:'Prime Day',d:'07-15',off:{提报:-60,早鸟:-45,入仓:-30,开卖:0}},
      {n:'秋のセール',d:'10-01',off:{提报:-45,早鸟:-35,入仓:-22,开卖:0}},
      {n:'年末商戦',d:'12-20',off:{提报:-40,早鸟:-30,入仓:-25,开卖:0}},
      {n:'初売り',d:'01-02',off:{提报:-50,早鸟:-40,入仓:-30,开卖:0}}
    ]
  };
  function genNodes(site,year){
    const out=[];
    (NODE_TPL[site]||[]).forEach(ev=>{
      const base=new Date(`${year}-${ev.d}T00:00:00`);
      if(isNaN(base)) return;
      Object.keys(ev.off).forEach(type=>{
        const dt=new Date(base);
        dt.setDate(dt.getDate()+ev.off[type]);
        out.push({
          site,year,eventName:ev.n,type,
          deadline:dt.toISOString().slice(0,10),
          actionGuide:NODE_GUIDE[type],
          linkedModule:NODE_LINK[type],
          done:false
        });
      });
    });
    return out;
  }
  const NODE_GUIDE={
    提报:'确认提报资格与价格要求，在后台完成 Deal 提报；检查库存是否覆盖预估销量',
    早鸟:'核对提报状态与活动价格，准备主图/A+/Coupon，锁定价盘',
    入仓:'按备货倒推完成发货入仓，避免旺季拥堵；核对 FBA 接收差异',
    开卖:'活动当日监控：价格、库存、广告预算、Buy Box、差评与绩效'
  };
  const NODE_LINK={提报:'stores',早鸟:'listing',入仓:'inventory',开卖:'ads'};

  /* ---------- 演示数据 ---------- */

        {storeId:stores[2].id,asin:'B0XK3DEMO4',sku:'AJ-CUP-01',name:'保温杯 500ml',category:'厨具',
         price:24.5,cost:{purchase:5.0,firstLeg:1.9,fbaFee:4.2,commission:.1,storage:.3,returnLoss:.04,targetAcos:.22}}
      ];
      pids=[];
      for(const p of prods){ const id=await DB.put('products',p); pids.push({id,...p}); }
      // 批量生成 kpi_daily：365 天 × 4 品 = 1460 条，必须一次事务 bulk 写入，否则 1460 个并发 put 会卡死浏览器
      const kpiRows=[];
      for(let i=364;i>=0;i--){
        pids.forEach((p,idx)=>{
          const d=new Date(today); d.setDate(d.getDate()-i);
          const base=[42,30,18,12][idx];
          const orders=Math.max(1,Math.round(base+rnd(-8,10)));
          const sales=+(orders*p.price*(1+rnd(-5,15)/100)).toFixed(2);
          const adSpend=+(sales*rnd(8,24)/100).toFixed(2);
          const adSales=+(adSpend*(1.6+rnd(0,28)/10)).toFixed(2);
          const sessions=Math.round(orders/(0.06+rnd(0,60)/1000)*1);
          kpiRows.push({storeId:p.storeId,productId:p.id,date:d.toISOString().slice(0,10),
            sessions,orders,sales,cvr:+(orders/sessions*100).toFixed(2),aov:+(sales/orders).toFixed(2),
            adSpend,adSales,acos:adSales?+(adSpend/adSales*100).toFixed(2):null,
            refunds:rnd(0,Math.max(1,Math.round(orders*.06))),
            refundRate:+(rnd(0,60)/10).toFixed(2)});
        });
      }
      await DB.bulk('kpi_daily',kpiRows);
      const adsRows=[], invRows=[], listRows=[];
      pids.forEach((p,idx)=>{
        adsRows.push({storeId:p.storeId,productId:p.id,name:(idx%2?'SP-自动':'SP-手动核心词')+' '+p.sku,
          campaignType:idx%2?'SP-Auto':'SP-Manual',dailyBudget:30+idx*10,spend:[120,90,60,45][idx],
          sales:[430,260,150,120][idx],impressions:[12000,9000,5000,3000][idx],clicks:[210,150,70,45][idx],
          date:today.toISOString().slice(0,10)});
        invRows.push({productId:p.id,fbaQty:[180,320,90,240][idx],inboundQty:[0,120,60,0][idx],
          reserveQty:[10,15,5,8][idx],dailySalesAvg:[42,30,18,12][idx],leadDays:[45,45,35,40][idx], // dailySalesAvg 现为兜底值：kpi_daily 有该品近30天数据时由页面动态覆盖
          aging90:[0,20,35,0][idx],aging180:[0,0,10,0][idx]});
        listRows.push({productId:p.id,title:p.name+' | 品牌+核心词+属性+卖点 (示例)',
          bullets:[1,1,1,1,0][idx],images:[7,7,5,6][idx],aPlus:[1,1,0,1][idx],
          keywords:'收纳 折叠 家居 整理',cvrBaseline:[8.5,7.2,4.1,5.6][idx],lastAudit:null});
      });
      await DB.bulk('ads',adsRows);
      await DB.bulk('inventory',invRows);
      await DB.bulk('listings',listRows);
      await DB.bulk('reviews',[
        {productId:pids[0].id,date:today.toISOString().slice(0,10),rating:1,
          sentiment:'负',reasonTags:'尺寸,描述不符',quote:'比图片里小很多，装不下被子',actionTaken:''},

      ]);
      await DB.bulk('compliance',[
        {storeId:stores[1].id,item:'CE 认证（LED 台灯）',region:'EU',
          expireDate:'2027-05-31',status:'有效',reminderDays:90},
        {storeId:stores[0].id,item:'品牌商标 US',region:'US',
          expireDate:'2026-11-30',status:'有效',reminderDays:60}
      ]);
      const y=today.getFullYear();
      await DB.bulk('nodes', genNodes('US',y).concat(genNodes('EU',y),genNodes('JP',y),genNodes('US',y+1)));
      DB.put('tasks',{source:'节点',title:'黑五网一提报：确认 Deal 资格与活动价',priority:'红',
        dueDate:`${y}-09-18`,relatedId:null,done:false});
      DB.put('tasks',{source:'诊断',title:'LED 台灯库存覆盖不足 14 天，安排补货',priority:'红',
        dueDate:today.toISOString().slice(0,10),relatedId:null,done:false});

      stores=await DB.all('stores');

    }
    return {stores,pids};

  async function fillTable(store,builder){

    const rows=await builder();
    if(rows&&rows.length) await DB.bulk(store,rows);

<script>
/* js/ui.js */
(function(){
  const $=(s,r)=>(r||document).querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const num=(v,d)=>{const n=Number(v);return isFinite(n)?n:(d===undefined?null:d)};
  const dash=v=>{const n=Number(v);return isFinite(n)?null:null};
  function f2(v){const n=Number(v);return isFinite(n)?n.toFixed(2):'—'}
  function f0(v){const n=Number(v);return isFinite(n)?Math.round(n).toLocaleString('en-US'):'—'}
  function money(v,c){const n=Number(v);return isFinite(n)?(c||'$')+n.toFixed(2):'—'}
  function pct(v){const n=Number(v);return isFinite(n)?n.toFixed(1)+'%':'—'}
  function today(){return new Date().toISOString().slice(0,10)}
  function dstr(d){return d instanceof Date?d.toISOString().slice(0,10):String(d||'')}
  function addDays(dateStr,n){const d=new Date(dateStr);d.setDate(d.getDate()+n);return dstr(d)}
  function diffDays(a,b){const x=new Date(a),y=new Date(b);return Math.round((x-y)/86400000)}

  /* ---------- 阈值（可由设置页覆盖） ---------- */
  const DEFAULT_RULES={
    stockRed:14, stockYellow:30,
    marginRed:5, marginYellow:15,
    adShareYellow:30, adShareRed:40,
    returnRateYellow:5, returnRateRed:10,
    agingRed:180, agingYellow:90,
    nodeRedDays:7, nodeYellowDays:30
  };
  let _rules=Object.assign({},DEFAULT_RULES);
  function setRules(r){_rules=Object.assign({},DEFAULT_RULES,r||{})}
  const R=()=>_rules;

  /* ---------- 利润口径（全站唯一） ---------- */
  function profit(p){
    const c=p&&p.cost||{};
    const price=num(p.price,0), purchase=num(c.purchase,0), firstLeg=num(c.firstLeg,0),
      fba=num(c.fbaFee,0), comm=num(c.commission,.15), storage=num(c.storage,0),
      ret=num(c.returnLoss,.05), tAcos=num(c.targetAcos,.25);
    const commFee=price*comm;
    const adCost=price*tAcos;
    const retCost=(price+firstLeg+fba)*ret;
    const total=purchase+firstLeg+fba+commFee+storage+retCost+adCost;
    const net=price-total;
    const grossBeforeAd=price-(purchase+firstLeg+fba+commFee+storage+retCost);
    return {
      price,purchase,firstLeg,fba,commFee,storage,retCost,adCost,total,net,
      margin:price?net/price*100:null,
      grossMargin:price?grossBeforeAd/price*100:null,
      breakEvenAcos:price?grossBeforeAd/price*100:null,
      breakEvenRoi:grossBeforeAd?price/grossBeforeAd:null
    };
  }
  function marginColor(m){const r=R();if(m==null||!isFinite(m))return 'gray';
    if(m<r.marginRed)return 'red'; if(m<r.marginYellow)return 'yellow'; return 'green'}
  const colorTag={red:'t-red',yellow:'t-yellow',green:'t-green',gray:'t-gray'};
  const colorDot={red:'d-red',yellow:'d-yellow',green:'d-green',gray:'d-gray'};
  function tag(text,c){return `<span class="tag ${colorTag[c]||'t-gray'}">${esc(text)}</span>`}
  function dot(c){return `<span class="dot ${colorDot[c]||'d-gray'}"></span>`}

  /* ---------- 风险等级（紧急/高/中） ---------- */
  const SEV_CLASS={'紧急':'t-urgent','高':'t-high','中':'t-mid'};
  function sevTag(sev){return `<span class="tag ${SEV_CLASS[sev]||'t-mid'}">${esc(sev)}</span>`}
  function severityOf(a){
    if(a.level==='red') return ['合规','账户','库存'].includes(a.type)?'紧急':'高';
    return '中';
  }

  /* ---------- 组件 ---------- */
  function card(title,body,sub){return `<div class="card"><h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:''}${body}</div>`}
  function kpi(list){
    return `<div class="grid g${list.length>4?4:list.length}" style="margin-bottom:14px">`+
      list.map(k=>{const ek=(k.value==='—'||k.value==null)?' k-empty':'';
        return `<div class="kpi ${k.level||''}${ek}"><div class="k-lab">${esc(k.label)}</div>
        <div class="k-val">${k.value}</div><div class="k-sub">${k.sub||''}</div></div>`}).join('')+`</div>`;
  }
  function empty(text,sub){return `<div class="empty">${esc(text||'暂无数据')}${sub?`<div style="font-size:12px;margin-top:6px;color:var(--ink2)">${esc(sub)}</div>`:''}</div>`}
  function statBar(cnt,n){
    return `<div class="stat-bar">
      <span class="sb-item sb-urgent">紧急 ${cnt['紧急']||0}</span>
      <span class="sb-item sb-high">高 ${cnt['高']||0}</span>
      <span class="sb-item sb-mid">中 ${cnt['中']||0}</span>
      <span class="sb-item sb-total">合计 ${n}</span>
    </div>`;
  }
  function alertItem(a,doneKeys){
    const sev=severityOf(a); const lvl=a.level==='gray'?'gray':a.level;
    const isDone=doneKeys&&doneKeys.has&&doneKeys.has(a.key);
    const cls=['alert-item',a.expired?'expired':'',lvl==='red'?'lv-red':lvl==='yellow'?'lv-yellow':lvl==='gray'?'lv-gray':''].join(' ');
    return `<div class="${cls}">
      <div class="ai-main">${dot(lvl)}${sevTag(sev)}${tag(a.type,lvl)}
        <span class="ai-text">${esc(a.text)}</span></div>
      <div class="ai-foot">
        ${a.countdown!=null?`<span class="ai-count ${a.expired?'expired':(a.countdown<=R().nodeRedDays?'red':'gray')}">${a.expired?'⏱ 已过期 '+(-a.countdown)+' 天':'⏱ 剩 '+a.countdown+' 天'}</span>`:''}
        <span class="ai-actions">
          ${a.link?`<button class="btn-ghost btn-sm" data-nav="${a.link}">去处理</button>`:''}
          <button class="btn-ghost btn-sm" data-task="${esc(a.key||a.text)}" data-lv="${a.level}" ${isDone?'disabled':''}>${isDone?'已转待办':'转待办'}</button>
        </span>
      </div>
    </div>`;
  }
  function table(opts){
    const cols=opts.cols, rows=opts.rows||[];
    if(!rows.length) return `<div class="empty">${esc(opts.empty||'暂无数据')}</div>`;
    return `<div style="overflow:auto"><table><thead><tr>`+
      cols.map(c=>`<th class="${c.num?'num':''}">${esc(c.t)}</th>`).join('')+

  function toCSV(rows,headers){

  function download(name,text,mime){
    const blob=new Blob(['\ufeff'+text],{type:mime||'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  }

  function parseCSV(text){
    const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length) return [];
    const split=l=>{const out=[];let cur='',q=false;
      for(let i=0;i<l.length;i++){const ch=l[i];
        if(ch==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++} else q=!q; }
        else if(ch===','&&!q){out.push(cur);cur=''} else cur+=ch;
      } out.push(cur); return out.map(s=>s.trim())};
    const head=split(lines[0]);
    return lines.slice(1).map(l=>{const v=split(l);const o={};head.forEach((h,i)=>o[h]=v[i]);return o});
  }

  /* 母口径利润公式 2.0（B2）：显式金额字段 + 记录级汇率，与 U.profit 并存 */
  function profitV2(rec){
    const n=(v,d)=>{const x=Number(v);return isFinite(x)?x:(d===undefined?0:d);};
    const price=n(rec.price), purchase=n(rec.purchase), firstLeg=n(rec.firstLeg),
      fbaFee=n(rec.fbaFee), commission=n(rec.commission), refund=n(rec.refund),
      ad=n(rec.ad), storageOther=n(rec.storageOther), promo=n(rec.promo);
    const cost=purchase+firstLeg+fbaFee+commission+refund+ad+storageOther+promo;
    const profit=price-cost;
    const rate=n(rec.rate, 6.8);
    const netPct=price?profit/price*100:null;
    const profitRmb=profit*rate;
    const breakEvenAcos=price?
      (price-(purchase+firstLeg+fbaFee+commission+refund+storageOther+promo))/price*100:null;
    return {cost$:cost, profit$:profit, netPct, profitRmb, breakEvenAcos};
  }

  /* FBA 体积重（lb）：长×宽×高(inch)/139（注意与头程体积重 ÷6000 cm 不同，勿混用） */
  function fbaVolWeightLb(dims){
    const l=Number(dims.l), w=Number(dims.w), h=Number(dims.h);
    const x=(l*w*h)/139;
    return isFinite(x)?x:0;
  }
  /* FBA 尺寸分段判定：dims={l,w,h(inch); weightLb} → 返回 tier key
   * key ∈ smallStandard | largeStandard | smallBulky | largeBulky
   *      | oversize-0-50 | oversize-50-70 | oversize-70-150 | oversize-150plus */
  function fbaTier(dims){
    const l=Number(dims.l), w=Number(dims.w), h=Number(dims.h), weightLb=Number(dims.weightLb);
    const edges=[l,w,h].map(x=>isFinite(x)?x:0).sort((a,b)=>b-a); // 降序：最长/次长/最短
    const longest=edges[0], second=edges[1], shortest=edges[2];
    const girth=2*(second+shortest);          // L+girth 中的 girth
    const lPlusGirth=longest+girth;
    // 小号标准
    if(longest<=15 && second<=12 && shortest<=0.75 && weightLb<=1) return 'smallStandard';
    // 大号标准（不满足小号标准，但满足大号标准）
    if(longest<=18 && second<=14 && shortest<=8 && weightLb<=20) return 'largeStandard';
    // 超大件判定（任一成立即超大件）
    const isOversize = longest>59 || second>33 || shortest>33 || lPlusGirth>130 || weightLb>50;
    if(isOversize){
      if(weightLb>150) return 'oversize-150plus';
      if(weightLb>70)  return 'oversize-70-150';
      if(weightLb>50)  return 'oversize-50-70';
      return 'oversize-0-50';
    }
    // 小号大件（≤50lb，尺寸在范围内，L+girth≤130）
    if(weightLb<=50 && longest<=37 && second<=28 && shortest<=20 && lPlusGirth<=130) return 'smallBulky';
    // 大号大件
    if(weightLb<=50 && longest<=59 && second<=33 && shortest<=33 && lPlusGirth<=130) return 'largeBulky';
    // 兜底（理论上不会到这）：归入大号标准
    return 'largeStandard';
  }
  /* FBA 计费重量（lb）：按分段规则取 实重 或 实重与体积重(÷139)取大 */
  function fbaChargeableWeight(tierKey, dims){
    const actual=Number(dims.weightLb)||0;
    const T=FBA_RATES.tiers;
    let t=T[tierKey];
    if(tierKey && tierKey.indexOf('oversize')===0) t=T.oversize.bands[tierKey.split('-').slice(1).join('-')];
    if(!t) return actual;
    if(t.billingWeight==='actual') return actual;
    return Math.max(actual, fbaVolWeightLb(dims));
  }
  /* FBA 配送费查表：tierKey + 计费重量(lb) → $（基础费 + 续重 + 燃油物流附加费）
   * opts.priceBand      : 'low' | 'mid' | 'high'（默认 'mid'，对应 $10-50 价格带）
   * opts.includeSurcharge: 是否计入 3.5% 燃油物流附加费（默认 true；false 仅基础费+续重） */
  function fbaFee(tierKey, weightLb, opts){
    opts=opts||{};
    const priceBand=opts.priceBand||'mid';
    const includeSurcharge = opts.includeSurcharge!==false; // 默认计入
    const T=FBA_RATES.tiers;
    // 超大件（复合 key：oversize-0-50 / 50-70 / 70-150 / 150plus）优先处理，避免被下方 T[tierKey] 空值守卫误拦截
    if(tierKey && tierKey.indexOf('oversize')===0){
      const bandKey=tierKey.split('-').slice(1).join('-'); // 0-50 / 50-70 / 70-150 / 150plus
      const band=T.oversize.bands[bandKey];
      if(!band) return null;
      const base=band.base[priceBand];
      const over=Number(weightLb)-band.firstLb;
      const extra=Math.max(0,Math.ceil(over))*band.perLb; // 超出首磅部分，不足1lb按1lb
      if(base==null) return null;
      let fee=base+extra;
      if(includeSurcharge) fee=fee*(1+FBA_RATES.surchargePct);
      return +fee.toFixed(2);
    }
    const t=T[tierKey];
    if(!t) return null;
    let base=null, extra=0;
    if(tierKey==='smallStandard'){
      const oz=Number(weightLb)*16;
      const seg=(t.byOz||[]).find(s=>oz<=s.maxOz);
      if(!seg) return null;
      base=seg[priceBand];
    } else if(tierKey==='largeStandard'){
      const lb=Number(weightLb);
      if(lb<=3){
        const seg=(t.byOzOrLb||[]).find(s=>lb<=s.maxLb);
        if(!seg) return null;
        base=seg[priceBand];
      } else {
        base=t.base[priceBand];
        const over=lb-t.overBaseLb;                  // 超出 3lb 部分
        const halfPounds=Math.ceil(over/0.5);         // 不足半磅按半磅
        extra=Math.max(0,halfPounds)*t.perHalfLb;
      }
    } else if(tierKey==='smallBulky'||tierKey==='largeBulky'){
      base=t.base[priceBand];
      const over=Number(weightLb)-t.firstLb;
      const lbs=Math.ceil(over);                       // 不足1lb按1lb
      extra=Math.max(0,lbs)*t.perLb;
    }
    if(base==null) return null;
    let fee=base+extra;
    if(includeSurcharge) fee=fee*(1+FBA_RATES.surchargePct);
    return +fee.toFixed(2);
  }
  /* 便捷：由尺寸直接估算 FBA 配送费（自动判定分段 + 计费重量） */
  function fbaEstimate(dims, opts){
    const tier=fbaTier(dims);
    const wt=fbaChargeableWeight(tier, dims);
    const fee=fbaFee(tier, wt, opts);
    return { tier, chargeableLb:+(+wt).toFixed(3), fee };
  }
  /* FBA 分段中文标签（tierKey → 中文；用于表格/表单展示） */
  function fbaTierLabel(key){
    if(key && key.indexOf('oversize')===0){
      const b=FBA_RATES.tiers.oversize.bands[key.split('-').slice(1).join('-')];
      return b?b.label:key;
    }
    const t=FBA_RATES.tiers[key];
    return t?t.label:key;
  }

  /* B5：汇率（CNY per 1 外币），2026-09-12 多家银行中间价（来源：主理人检索）
   * ⚠️ 参考值，实际以后台/银行实时为准；记录级可编辑，请勿当作权威定死值。
   * JPY 用 per 1 日元 = 0.0437（即 100 日元 = 4.3665）。其余站点币种留空待维护。 */
  const RATES = {
    USD: 6.71, EUR: 7.78, GBP: 9.07, JPY: 0.0437,
    CAD: null, AUD: null, SGD: null, CHF: null, MXN: null // 可按同来源补充或留空待维护
  };
  const DEFAULT_RATE = RATES.USD; // USD 默认别名（记录级 rate 字段初始值，不全局硬编码）

  /* C：头程费率（2026 行业参考，深圳起运，人民币/kg）
   * 实重与体积重取大；体积重=长×宽×高(cm)/6000；海运另 1CBM=167kg。
   * ⚠️ 参考值，需按货代实时报价维护（标注"参考值"），记录级可编辑。 */
  const FIRST_LEG_RATES = {
    express:    { rate: 70, range: [60, 90],  note: '快递直发(DHL/UPS/FedEx)，参考值' },
    air:        { rate: 45, range: [42, 50],  note: '空派，参考值' },
    seaExpress: { rate: 13, range: [11, 15],  note: '海派快船(美森/以星)，参考值' },
    seaTruck:   { rate: 8,  range: [6, 9],    note: '海卡普船，参考值' }
  };
  /* 头程成本：weightKg（计费重量 kg，实重与体积重取大由调用方算好）+ channel（express/air/seaExpress/seaTruck）→ 人民币 */
  function firstLegCost(weightKg, channel){
    const c=(channel && FIRST_LEG_RATES[channel]) || FIRST_LEG_RATES.seaExpress;
    const w=Number(weightKg)||0;
    return +(w*c.rate).toFixed(2);
  }

  /* B6：头程抛重（÷div 取大，默认 ÷6000 cm） */
  function volWeight(l,w,h,div){ div=div||6000; const x=Number(l)*Number(w)*Number(h)/Number(div); return isFinite(x)?x:0; }
  function chargeableWeight(real, vol){ return Math.max(Number(real)||0, Number(vol)||0); }

  /* D：ABA 推荐/趋势判定（B7，来源：模板「使用说明」sheet）
   * 输入 rec: {rankQ1,rankQ2,rankQ3,rankQ4}（季度搜索词排名；rank=10000 代表"无参数/无排名"）
   * 返回 {trend, capacity, recommend}：命中填 '增量产品'/'容量大'/'推荐产品'，否则空串。
   * opts.capacityThreshold 默认 3000（可配置，见 ABA_CAPACITY_THRESHOLD）。 */
  const ABA_CAPACITY_THRESHOLD = 3000;
  function computeAba(rec, opts){
    opts=opts||{};
    const threshold = (opts.capacityThreshold!=null) ? opts.capacityThreshold : ABA_CAPACITY_THRESHOLD;
    const ranks=[rec.rankQ1, rec.rankQ2, rec.rankQ3, rec.rankQ4].map(x=>{
      const n=Number(x); return isFinite(n)?n:null;
    });
    const valid=ranks.filter(r=>r!=null && r!==10000); // 排除无参数(=10000)
    // 增量产品：排除无参数后，剩余有效季度排名严格单调递减（q1>q2>q3>q4，数值下降=热度上升）
    let trend='';
    if(valid.length>=2){
      let mono=true;
      for(let i=1;i<valid.length;i++){ if(valid[i]>valid[i-1]){ mono=false; break; } }
      if(mono) trend='增量产品';
    }
    // 容量大：存在有效季度排名 ≤ 阈值
    let capacity='';
    if(valid.some(r=>r<=threshold)) capacity='容量大';
    // 推荐产品：增量产品 && 容量大
    const recommend = (trend && capacity) ? '推荐产品' : '';
    return { trend, capacity, recommend };
  }

  /* 近 30 天日均销量（代理口径：kpi_daily 日均订单数），用于库存可售天数动态计算。
   * kpi_daily 无独立「销量件数」字段，以每日 orders 作销量代理；近 30 天(含今天)按 productId 求均值。
   * 返回 {productId: 日均}，无销售数据的品不出现在 map 中（调用方回退到录入兜底值）。 */
  async function dailyAvgMap(){
    const DBg=window.DB; // db.js 的 DB 仅挂到 window.DB，跨 IIFE 须显式取
    if(!DBg||!DBg.all) return {};
    let kpi=[];
    try{ kpi=await DBg.all('kpi_daily'); }catch(e){ kpi=[]; }
    const from=addDays(today(),-29);
    const to=today();
    const sum={},cnt={};
    kpi.forEach(k=>{ if(k.date>=from&&k.date<=to){
      const p=k.productId; sum[p]=(sum[p]||0)+(Number(k.orders)||0); cnt[p]=(cnt[p]||0)+1; } });
    const m={}; Object.keys(sum).forEach(p=>{ if(cnt[p]) m[p]=+(sum[p]/cnt[p]).toFixed(1); });
    return m;
  }

  window.UI={$,esc,num,f0,f2,money,pct,today,dstr,addDays,diffDays,R,setRules,profit,marginColor,tag,dot,
    sevTag,severityOf,card,kpi,table,empty,statBar,alertItem,toast,modal,confirmBox,formFields,formValues,chart,clearCharts,
    toCSV,download,exportCSV,parseCSV,
    tabs,bindTabs,subTabs,bindSubTabs,sectionCard,imgField,exportXLSX,profitV2,
    FBA_RATES,fbaTier,fbaVolWeightLb,fbaChargeableWeight,fbaEstimate,fbaTierLabel,fbaFee,
    RATES,DEFAULT_RATE,FIRST_LEG_RATES,firstLegCost,
    volWeight,chargeableWeight,computeAba,ABA_CAPACITY_THRESHOLD,dailyAvgMap};
})();

</script>
<script>
/* js/mod-command.js */
(function(){
  const P={};
  const U=window.UI, DB=window.DB;

  const STEPS=[
    {id:'account',t:'账户',items:['账户健康 ACH 分数','绩效通知/警告','商品停售或抑制','验证码/二审风险']},
    {id:'sales',t:'销售',items:['销售额与订单环比','转化率是否异常','客单价变化','是否断崖式下跌']},
    {id:'ads',t:'广告',items:['广告花费与预算','ACOS 是否超保本线','高花费零转化活动','排名/曝光异动']},
    {id:'inventory',t:'库存',items:['可售天数','断货风险','在途与接收差异','长期仓储费风险']},
    {id:'cvr',t:'转化',items:['主图与五点完整性','A+ 是否正常展示','新增差评','价格与 Buy Box']},
    {id:'after',t:'售后',items:['退货率','退款单','FBA 丢失损坏待索赔','客服未回复']},
    {id:'policy',t:'政策',items:['类目/合规要求变更','认证与税号有效期','平台政策通知','知识产权风险']}
  ];

  async function productMap(){
    const ps=await DB.all('products'); const m={}; ps.forEach(p=>m[p.id]=p); return m;
  }
  async function anomalies(){
    const out=[];
    const stores=await DB.all('stores'); const prods=await DB.all('products');
    const invs=await DB.all('inventory'); const ads=await DB.all('ads');
    const comps=await DB.all('compliance'); const nodes=await DB.all('nodes');
    let ahs=[]; try{ ahs=await DB.all('account_health'); }catch(e){ ahs=[]; }
    const pm={}; prods.forEach(p=>pm[p.id]=p);
    const sm={}; stores.forEach(s=>sm[s.id]=s);
    const r=U.R();
    const avg=await U.dailyAvgMap();
    invs.forEach(i=>{
      const p=pm[i.productId]; if(!p) return;
      const daily=avg[i.productId]!=null?avg[i.productId]:(Number(i.dailySalesAvg)||0);
      const cover=daily>0?(i.fbaQty+i.inboundQty-i.reserveQty)/daily:null;
      if(cover!=null&&cover<r.stockRed) out.push({level:'red',type:'库存',storeId:p.storeId,countdown:Math.floor(cover),
        text:`${p.sku} 可售仅 ${cover.toFixed(0)} 天（<${r.stockRed} 天），最晚补货日 ${U.addDays(U.today(),Math.max(0,Math.floor(cover)-i.leadDays))}`,link:'inventory',key:`库存|COVER|${p.id}`});
      else if(cover!=null&&cover<r.stockYellow) out.push({level:'yellow',type:'库存',storeId:p.storeId,countdown:Math.floor(cover),
        text:`${p.sku} 可售 ${cover.toFixed(0)} 天，需安排补货`,link:'inventory',key:`库存|COVER|${p.id}`});
      if(num180(i)>0) out.push({level:'red',type:'库存',storeId:p.storeId,
        text:`${p.sku} 库龄 >180 天 ${i.aging180} 件，长期仓储费风险`,link:'inventory',key:`库存|AGING|${p.id}`});
    });
    ads.forEach(a=>{
      const p=pm[a.productId]; if(!p) return;
      const pf=U.profit(p); const be=pf.breakEvenAcos; const acos=a.sales?a.spend/a.sales*100:null;
      if(acos!=null&&be!=null&&acos>be) out.push({level:'red',type:'广告',storeId:p.storeId,
        text:`${a.name} ACOS ${acos.toFixed(1)}% 超保本线 ${be.toFixed(1)}%`,link:'ads',key:`广告|ACOS|${a.productId}`});
      if(a.spend>0&&(!a.sales||a.sales===0)) out.push({level:'yellow',type:'广告',storeId:p.storeId,
        text:`${a.name} 有花费无产出`,link:'ads',key:`广告|NOSALE|${a.productId}`});
    });
    prods.forEach(p=>{
      const pf=U.profit(p);
      if(pf.margin!=null&&pf.margin<r.marginRed) out.push({level:'red',type:'利润',storeId:p.storeId,
        text:`${p.sku} 净利率 ${pf.margin.toFixed(1)}% 低于 ${r.marginRed}%`,link:'products',key:`利润|MARGIN|${p.id}`});
    });
    comps.forEach(c=>{
      const d=U.diffDays(c.expireDate,U.today());
      if(d<0) out.push({level:'red',type:'合规',storeId:c.storeId,expired:true,countdown:d,
        text:`${c.item} 已过期 ${-d} 天`,link:'compliance',key:`合规|EXP|${c.storeId}|${c.item}`});
      else if(d<=(c.reminderDays||30)) out.push({level: d<=r.nodeRedDays?'red':'yellow',type:'合规',storeId:c.storeId,countdown:d,
        text:`${c.item} 将在 ${d} 天后到期`,link:'compliance',key:`合规|EXP|${c.storeId}|${c.item}`});
    });
    ahs.forEach(a=>{
      const st=sm[a.storeId]; const sn=st?st.name:'店铺';
      if(a.ahr!=null&&a.ahr<200) out.push({level:'red',type:'账户',storeId:a.storeId,
        text:`${sn} 账户健康分 AHR ${a.ahr} 低于 200，存在停号风险`,link:'stores',key:`账户|AHR|${a.storeId}`});
      else if(a.ahr!=null&&a.ahr<300) out.push({level:'yellow',type:'账户',storeId:a.storeId,
        text:`${sn} 账户健康分 AHR ${a.ahr}，需关注`,link:'stores',key:`账户|AHR|${a.storeId}`});
      if(a.suppressed>0) out.push({level:'red',type:'账户',storeId:a.storeId,
        text:`${sn} 有 ${a.suppressed} 个 ASIN 被停售/抑制，需申诉恢复`,link:'stores',key:`账户|SUP|${a.storeId}`});
      if(a.policyWarnings>0) out.push({level:'yellow',type:'账户',storeId:a.storeId,
        text:`${sn} 有 ${a.policyWarnings} 条政策警告待处理`,link:'stores',key:`账户|POL|${a.storeId}`});
    });
    nodes.forEach(n=>{
      if(n.done) return;
      const d=U.diffDays(n.deadline,U.today());
      if(d<0){ if(d>=-30) out.push({level:'gray',type:'节点',storeId:null,expired:true,countdown:d,
        text:`${n.site} ${n.eventName} · ${n.type} 已逾期 ${(-d)} 天（截止 ${n.deadline}）`,link:'peak',key:`节点|EXP|${n.id}`}); return; }
      if(d<=r.nodeYellowDays) out.push({level:d<=r.nodeRedDays?'red':'yellow',type:'节点',storeId:null,countdown:d,
        text:`${n.site} ${n.eventName} · ${n.type} 截止 ${n.deadline}（剩 ${d} 天）`,link:'peak',key:`节点|DUE|${n.id}`});
    });
    const order={red:0,yellow:1,gray:2};
    const typeOrder={合规:0,账户:1,库存:2,利润:3,广告:4,节点:5};
    const to=t=>t!=null?typeOrder[t]:9;
    out.sort((a,b)=>(order[a.level]-order[b.level])||(to(a.type)-to(b.type))
      ||(a.countdown==null?1:(b.countdown==null?-1:a.countdown-b.countdown)));
    return out;
  }
  function num180(i){return Number(i.aging180)||0}

  /* ============ 1. 店铺总览 ============ */
  P.dashboard=async root=>{
    U.clearCharts();
    const kpi=await DB.all('kpi_daily');
    const f=App.filters;
    const inRange=r=>{
      const d=r.date;
      if(f.from&&d<f.from) return false;
      if(f.to&&d>f.to) return false;
      return App.inScope(r.storeId);
    };
    const cur=kpi.filter(inRange);
    const from=f.from||U.addDays(U.today(),-29), to=f.to||U.today();
    const len=Math.max(1,U.diffDays(to,from)+1);
    const prevFrom=U.addDays(from,-len), prevTo=U.addDays(from,-1);
    const prev=kpi.filter(r=>r.date>=prevFrom&&r.date<=prevTo&&App.inScope(r.storeId));
    const sum=(arr,k)=>arr.reduce((a,b)=>a+(Number(b[k])||0),0);
    const s1=sum(cur,'sales'), s0=sum(prev,'sales');
    const o1=sum(cur,'orders'), o0=sum(prev,'orders');
    const ad1=sum(cur,'adSpend'), ads1=sum(cur,'adSales');
    const se1=sum(cur,'sessions');
    const chg=(a,b)=>{ if(!b) return '—'; const v=(a-b)/b*100;
      const cls=v>=0?'t-green':'t-red'; return `<span class="tag ${cls}">${v>=0?'+':''}${v.toFixed(1)}%</span>`};
    const acos1=ads1?ad1/ads1*100:null;
    const cvr1=se1?o1/se1*100:null;
    const prods=await DB.all('products'); const pm={}; prods.forEach(p=>pm[p.id]=p);
    let estNet=0,estSales=0;
    cur.forEach(r=>{const p=pm[r.productId]; if(!p)return; const pf=U.profit(p);
      estSales+=Number(r.sales)||0; estNet+=(Number(r.sales)||0)*(pf.margin||0)/100;});
    const netPct=estSales?estNet/estSales*100:null;

    // 综合 ACOS 保本线（按销售额加权）
    let wBeNum=0,wBeDen=0;
    cur.forEach(r=>{const p=pm[r.productId]; if(!p)return; const pf=U.profit(p);
      if(pf.breakEvenAcos!=null&&r.sales){ wBeNum+=pf.breakEvenAcos*r.sales; wBeDen+=r.sales; }});
    const beW=wBeDen?wBeNum/wBeDen:null;
    let acosLevel='';
    if(acos1!=null){ if(beW!=null&&acos1>beW) acosLevel='alert'; else if(acos1>25) acosLevel='warn'; }
    const netLevel=netPct!=null?(netPct<U.R().marginRed?'alert':(netPct<U.R().marginYellow?'warn':'')):'';

    root.innerHTML=
      U.kpi([
        {label:'销售额',value:U.money(s1),sub:'环比 '+chg(s1,s0),level:''},
        {label:'订单数',value:U.f0(o1),sub:'环比 '+chg(o1,o0)},
        {label:'转化率',value:U.pct(cvr1),sub:'会话 '+U.f0(se1)},
        {label:'广告花费',value:U.money(ad1),sub:'占销售额 '+(s1?U.pct(ad1/s1*100):'—'),
          level:(s1&&ad1/s1*100>U.R().adShareRed)?'alert':((s1&&ad1/s1*100>U.R().adShareYellow)?'warn':'')},
        {label:'综合 ACOS',value:U.pct(acos1),sub:beW!=null?('保本线 '+U.pct(beW)):'广告销售 '+U.money(ads1),level:acosLevel},
        {label:'估算净利',value:U.money(estNet),sub:'净利率 '+U.pct(netPct),level:netLevel}
      ])+
      `<div class="grid g2">
        <div class="card"><h3>销售与广告趋势</h3><div id="cSales" class="chart"></div></div>
        <div class="card"><h3>今日异常提醒</h3><div class="sub">排序铁律：合规 > 账户 > 库存 > 利润 > 广告 > 节点</div>
          <div id="anomBox"><div class="empty">加载中</div></div></div>
      </div>
      <div class="grid g2">
        <div class="card"><h3>转化漏斗（会话 → 订单 → 退款）</h3><div id="cFunnel" class="chart"></div></div>
        <div class="card"><h3>店铺销售构成</h3><div id="cPie" class="chart"></div></div>
      </div>`;

    const byDate={};
    cur.forEach(r=>{byDate[r.date]=byDate[r.date]||{sales:0,ad:0};
      byDate[r.date].sales+=Number(r.sales)||0; byDate[r.date].ad+=Number(r.adSpend)||0});
    const dates=Object.keys(byDate).sort();
    const cSalesEl=document.getElementById('cSales');
    if(dates.length) U.chart(cSalesEl,{
      tooltip:{trigger:'axis'},
      legend:{data:['销售额','广告花费'],top:0},
      xAxis:{type:'category',data:dates},
      yAxis:[{type:'value',name:'销售额'},{type:'value',name:'广告'}],
      series:[{name:'销售额',type:'line',smooth:true,data:dates.map(d=>+(byDate[d].sales).toFixed(2)),
        itemStyle:{color:'#1E5FA8'},areaStyle:{color:'#CFE0F2'}},
        {name:'广告花费',type:'line',smooth:true,yAxisIndex:1,data:dates.map(d=>+(byDate[d].ad).toFixed(2)),
        itemStyle:{color:'#C0392B'}}]
    }); else cSalesEl.innerHTML=U.empty('本期暂无销售数据','调整筛选区间或店铺范围后重试');

    const rf=sum(cur,'refunds');
    const cFunnelEl=document.getElementById('cFunnel');
    if(se1>0) U.chart(cFunnelEl,{
      tooltip:{trigger:'item'},
      series:[{type:'funnel',left:'10%',width:'80%',
        data:[{name:'会话',value:se1},{name:'订单',value:o1},{name:'退款',value:rf},{name:'净订单',value:Math.max(0,o1-rf)}],
        color:['#1E5FA8','#D4A017','#C0392B','#27AE60']}]
    }); else cFunnelEl.innerHTML=U.empty('本期暂无流量数据');

    const stores=await DB.all('stores'); const sm={}; stores.forEach(s=>sm[s.id]=s);
    const pie={}; cur.forEach(r=>{const n=sm[r.storeId]?sm[r.storeId].name:'未分配';pie[n]=(pie[n]||0)+(Number(r.sales)||0)});
    const cPieEl=document.getElementById('cPie');
    if(Object.keys(pie).length) U.chart(cPieEl,{
      tooltip:{trigger:'item'},
      legend:{bottom:0},
      series:[{type:'pie',radius:['40%','65%'],data:Object.keys(pie).map(k=>({name:k,value:+pie[k].toFixed(2)})),
        color:['#1E5FA8','#D4A017','#27AE60','#7E8C99','#C0392B']}]
    }); else cPieEl.innerHTML=U.empty('本期暂无销售构成数据');

    // 异常提醒：顶部统计 + 列表（去重 + 转待办闭环）
    const list=await anomalies();
    const cnt={紧急:0,高:0,中:0}; list.forEach(a=>{cnt[U.severityOf(a)]++;});
    const tasksAll=await DB.all('tasks');
    const doneKeys=new Set(tasksAll.filter(t=>t.sourceKey).map(t=>t.sourceKey));
    const byKey={}; list.forEach(a=>byKey[a.key]=a.text);
    const box=document.getElementById('anomBox');
    box.innerHTML=list.length?U.statBar(cnt,list.length)+
      `<div style="max-height:300px;overflow:auto">`+list.map(a=>U.alertItem(a,doneKeys)).join('')+`</div>`
      :U.empty('当前范围内无异常','继续保持先风险后经营的巡检节奏');
    box.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>App.go(b.dataset.nav));
    box.querySelectorAll('[data-task]').forEach(b=>b.onclick=async()=>{
      const key=b.dataset.task, lv=b.dataset.lv;
      if(doneKeys.has(key)){ U.toast('该异常已转为待办'); App.go('tasks'); return; }
      await DB.put('tasks',{source:'巡检',title:byKey[key]||key,sourceKey:key,
        priority:lv==='red'?'红':'黄',dueDate:U.addDays(U.today(),7),relatedId:null,done:false});
      U.toast('已转为待办（默认 +7 天）'); App.refresh();
    });
  };

  /* ============ 2. 风险清单 ============ */
  P.risk=async root=>{
    const stores=(await DB.all('stores')).filter(s=>App.inScope(s.id));
    const list=await anomalies();
    const domains=['合规','账户','库存','广告','利润','节点'];
    const idx={};
    const rank={green:0,gray:1,yellow:2,red:3};
    list.forEach(a=>{
      const sid=a.storeId||'ALL'; idx[sid]=idx[sid]||{};
      const cur=idx[sid][a.type]||'green';
      if(rank[a.level]>rank[cur]) idx[sid][a.type]=a.level;
    });
    const cell=(sid,d)=>{
      const v=(idx[sid]&&idx[sid][d])||null;
      const nodeAll=(idx['ALL']&&idx['ALL'][d])||null;
      const show=v||(d==='节点'?nodeAll:null)||'green';
      return `<td class="heat">${U.dot(show)}</td>`;
    };
    root.innerHTML=
      U.kpi([
        {label:'红灯项',value:String(list.filter(a=>a.level==='red').length),level:'alert',sub:'需立即处理'},
        {label:'黄灯项',value:String(list.filter(a=>a.level==='yellow').length),level:'warn',sub:'需要关注'},
        {label:'受影响的店铺',value:String(new Set(list.map(a=>a.storeId)).size),sub:'共 '+stores.length+' 家在范围内'}
      ])+
      `<div class="card"><h3>店铺 × 风险域热力矩阵</h3>
        <div class="sub">单元格可点击下钻；系统只做汇总与提醒，是否处置由你判断</div>
        <table><thead><tr><th>店铺</th>${domains.map(d=>`<th style="text-align:center">${d}</th>`).join('')}</tr></thead>
        <tbody>${stores.map(s=>`<tr><td>${U.esc(s.name)} <span style="color:var(--ink2);font-size:11px">${s.site}</span></td>
          ${domains.map(d=>cell(s.id,d)).join('')}</tr>`).join('')}</tbody></table>
      </div>
      <div class="card"><h3>异常明细</h3>`+
      (list.length?`        <table><thead><tr><th>级别</th><th>严重度</th><th>类型</th><th>店铺</th><th>说明</th></tr></thead><tbody>`+
        list.map(a=>{const st=stores.find(s=>s.id===a.storeId); const lvl=a.level==='gray'?'gray':a.level;
          return `<tr><td>${U.dot(lvl)}</td><td>${U.sevTag(U.severityOf(a))}</td><td>${U.esc(a.type)}</td>
          <td>${U.esc(st?st.name:'全局')}</td><td>${U.esc(a.text)}</td></tr>`}).join('')+`</tbody></table>`
        :`<div class="empty">无异常</div>`)+`</div>`;
    root.querySelectorAll('.heat').forEach(td=>{td.style.cursor='pointer'});
  };

  /* ============ 3. 每日巡店 SOP ============ */
  P.patrol=async root=>{
    const stores=await DB.all('stores');
    if(!stores.length){root.innerHTML=`<div class="empty">请先在「店铺与站点」添加店铺</div>`;return}
    const sidSel=App.state.patrolStore||stores[0].id;
    const date=U.today();
    const recs=(await DB.all('patrol')).filter(r=>r.storeId===sidSel&&r.date===date);
    const map={}; recs.forEach(r=>map[r.step]=r);
    const done=STEPS.filter(s=>map[s.id]).length;
    root.innerHTML=
      `<div class="card"><h3>今日巡店 SOP · ${U.esc(stores.find(s=>s.id===sidSel).name)}</h3>
        <div class="sub">固定顺序：账户 → 销售 → 广告 → 库存 → 转化 → 售后 → 政策。先风险，后经营；先异常，后优化。</div>
        <div class="toolbar">
          <select id="pStore" class="mini" style="max-width:220px">
            ${stores.map(s=>`<option value="${s.id}" ${s.id===sidSel?'selected':''}>${U.esc(s.name)}</option>`).join('')}
          </select>
          <span style="font-size:12px;color:var(--ink2)">进度 ${done}/7</span>
          <div class="bar" style="flex:1;min-width:120px"><i style="width:${done/7*100}%"></i></div>
          <button class="btn-ghost" id="pReport">生成日报</button>
        </div>
      </div>`+
      STEPS.map((s,i)=>{
        const r=map[s.id]||{};
        const st=r.status||'';
        return `<div class="sop-step ${st==='异常'?'bad':(st?'done':'')}">
          <div class="sop-head"><div class="sop-idx">${i+1}</div><b>${s.t}</b>
            ${st?U.tag(st,st==='异常'?'red':'green'):U.tag('未检查','gray')}
            <div style="margin-left:auto;display:flex;gap:6px">
              <button class="btn-ghost btn-sm" data-st="${s.id}" data-v="正常">正常</button>
              <button class="btn-danger btn-sm" data-st="${s.id}" data-v="异常">异常</button>
            </div>
          </div>
          <ul class="check">${s.items.map(it=>`<li>· ${U.esc(it)}</li>`).join('')}</ul>
          <input data-note="${s.id}" placeholder="异常备注（选填）" value="${U.esc(r.note||'')}" style="margin-top:8px">
        </div>`;
      }).join('');

    root.querySelector('#pStore').onchange=e=>{App.state.patrolStore=Number(e.target.value);App.refresh()};
    root.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{
      const step=b.dataset.st, v=b.dataset.v;
      const noteEl=root.querySelector(`[data-note="${step}"]`);
      const ex=recs.find(r=>r.step===step);
      await DB.put('patrol',{id:ex?ex.id:undefined,storeId:sidSel,date,step,status:v,note:noteEl?noteEl.value:''});
      if(v==='异常'){
        await DB.put('tasks',{source:'巡检',title:`${stores.find(s=>s.id===sidSel).name} · ${STEPS.find(s=>s.id===step).t}巡检异常`,
          priority:'红',dueDate:date,relatedId:null,done:false});
      }
      U.toast('已记录'); App.refresh();
    });
    root.querySelectorAll('[data-note]').forEach(el=>{
      el.onchange=async()=>{
        const step=el.dataset.note; const ex=recs.find(r=>r.step===step);
        if(ex){ex.note=el.value; await DB.put('patrol',ex); U.toast('备注已保存')}
      };
    });
    root.querySelector('#pReport').onclick=()=>{
      const txt=[`【巡店日报】${date} ${stores.find(s=>s.id===sidSel).name}`]
        .concat(STEPS.map((s,i)=>`${i+1}. ${s.t}：${(map[s.id]&&map[s.id].status)||'未检查'} ${(map[s.id]&&map[s.id].note)||''}`))
        .join('\n');
      U.modal({title:'巡店日报',body:`<textarea style="min-height:260px">${U.esc(txt)}</textarea>`,okText:'复制并关闭',
        onOk:b=>{const t=b.querySelector('textarea');t.select();try{document.execCommand('copy')}catch(e){} U.toast('已复制')}});
    };
  };

  /* ============ 4. 大促时间表 ============ */
  P.peak=async root=>{
    U.clearCharts();
    const all=await DB.all('nodes');
    const site=App.state.peakSite||'ALL';
    const year=App.state.peakYear||new Date().getFullYear();
    const nodes=all.filter(n=>(site==='ALL'||n.site===site)&&(!year||n.year===year));
    const st=n=>{
      if(n.done) return {c:'gray',t:'已完成',d:null};
      const d=U.diffDays(n.deadline,U.today());
      if(d<0) return {c:'gray',t:'已逾期',d};
      if(d<=U.R().nodeRedDays) return {c:'red',t:`剩 ${d} 天`,d};
      if(d<=U.R().nodeYellowDays) return {c:'yellow',t:`剩 ${d} 天`,d};
      return {c:'green',t:`剩 ${d} 天`,d};
    };
    nodes.sort((a,b)=>a.deadline<b.deadline?-1:1);
    root.innerHTML=
      `<div class="card"><h3>旺季节点倒计时</h3>
        <div class="sub">节点库按站点与年份生成，系统只记节点与倒推，提报与备货决策由你判断</div>
        <div class="toolbar">
          <select id="nSite" class="mini">${['ALL','US','EU','JP'].map(s=>`<option value="${s}" ${s===site?'selected':''}>${s==='ALL'?'全部站点':s}</option>`).join('')}</select>
          <select id="nYear" class="mini">${[year-1,year,year+1].map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}</select>
          <button class="btn-ghost" id="nGen">生成/补齐节点</button>
          <button class="btn-ghost" id="nAdd">新增自定义节点</button>
          <button class="btn-ghost" id="nCsv">导出 CSV</button>
        </div>
        <div class="grid g3">${nodes.map(n=>{
          const s=st(n);
          return `<div class="node ${s.c==='red'?'red':(s.c==='yellow'?'yellow':'')} ${s.t==='已逾期'||s.t==='已完成'?'over':''}">
            <div style="font-size:12px;color:var(--ink2)">${n.site} · ${n.year}</div>
            <div style="font-size:15px;font-weight:600;margin:4px 0">${U.esc(n.eventName)}</div>
            <div class="nd">${n.type}</div>
            <div style="font-size:12px;color:var(--ink2)">截止 ${n.deadline}</div>
            <div style="margin:6px 0">${U.tag(s.t,s.c)}</div>
            <div style="font-size:12px;color:var(--ink2);line-height:1.5">${U.esc(n.actionGuide||'')}</div>
            <div style="margin-top:8px;display:flex;gap:6px">
              <button class="btn-ghost btn-sm" data-done="${n.id}">${n.done?'标未完成':'标记完成'}</button>
              <button class="btn-ghost btn-sm" data-nav="${n.linkedModule||'stores'}">去对应模块</button>
              <button class="btn-ghost btn-sm" data-delnode="${n.id}">删除</button>
            </div>
          </div>`}).join('')||`<div class="empty">该站点/年份暂无节点，点击「生成/补齐节点」</div>`}</div>
      </div>
      <div class="card"><h3>旺季同期对比（销售额 vs 广告花费）</h3>
        <div class="sub">对比当前筛选区间与上一年同区间；历史不足时显示仅本期</div>
        <div id="cPeak" class="chart"></div></div>`;

    root.querySelector('#nSite').onchange=e=>{App.state.peakSite=e.target.value;App.refresh()};
    root.querySelector('#nYear').onchange=e=>{App.state.peakYear=Number(e.target.value);App.refresh()};
    root.querySelector('#nGen').onclick=async()=>{
      const sites=site==='ALL'?['US','EU','JP']:[site];
      let add=0;
      for(const s of sites){
        const have=all.filter(n=>n.site===s&&n.year===year);
        if(have.length) continue;
        await DB.bulk('nodes',window.DBNodes.genNodes(s,year)); add++;
      }
      U.toast(add?`已生成 ${add} 个站点节点`:'该站点本年节点已存在'); App.refresh();
    };
    root.querySelector('#nAdd').onclick=()=>{
      U.modal({title:'新增节点',body:U.formFields([
        {k:'site',t:'站点',type:'select',opts:[{v:'US',t:'US'},{v:'EU',t:'EU'},{v:'JP',t:'JP'}]},
        {k:'eventName',t:'活动名称',ph:'如 Prime Day'},
        {k:'type',t:'节点类型',type:'select',opts:['提报','早鸟','入仓','开卖'].map(v=>({v,t:v}))},
        {k:'deadline',t:'截止日期',type:'date',def:U.today()},
        {k:'year',t:'年份',type:'number',def:year},
        {k:'actionGuide',t:'该做什么',ph:'选填'}
      ]),onOk:async b=>{
        const v=U.formValues(b); v.year=Number(v.year)||year; v.done=false;
        await DB.put('nodes',v); U.toast('已新增');
      },after:()=>App.refresh()});
    };
    root.querySelector('#nCsv').onclick=()=>{
      U.exportCSV(`commander_nodes_${site}_${year}.csv`,
        nodes.map(n=>({站点:n.site,年份:n.year,活动:n.eventName,类型:n.type,截止:n.deadline,
          状态:st(n).t,指引:n.actionGuide||''})),['站点','年份','活动','类型','截止','状态','指引']);
    };
    root.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{
      const n=await DB.get('nodes',Number(b.dataset.done)); n.done=!n.done;
      await DB.put('nodes',n); App.refresh();
    });
    root.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>App.go(b.dataset.nav));
    root.querySelectorAll('[data-delnode]').forEach(b=>b.onclick=()=>{
      U.confirmBox('删除该节点？',async()=>{await DB.del('nodes',Number(b.dataset.delnode));App.refresh()});
    });

    const kpi=await DB.all('kpi_daily');
    const f=App.filters;
    const from=f.from||U.addDays(U.today(),-29),to=f.to||U.today();
    const cur=kpi.filter(r=>r.date>=from&&r.date<=to&&App.inScope(r.storeId));
    const py=year-1;
    const pf=from.replace(String(year),String(py)),pt=to.replace(String(year),String(py));
    const prev=kpi.filter(r=>r.date>=pf&&r.date<=pt&&App.inScope(r.storeId));
    const agg=(arr)=>{const m={};arr.forEach(r=>{m[r.date]=m[r.date]||{s:0,a:0};
      m[r.date].s+=Number(r.sales)||0;m[r.date].a+=Number(r.adSpend)||0});return m};
    const A=agg(cur),B=agg(prev);
    const dates=Object.keys(A).sort();
    U.chart(document.getElementById('cPeak'),{
      tooltip:{trigger:'axis'},legend:{data:['本期销售','本期广告','去年同期销售'],top:0},
      xAxis:{type:'category',data:dates},
      yAxis:{type:'value'},
      series:[
        {name:'本期销售',type:'bar',data:dates.map(d=>+A[d].s.toFixed(2)),itemStyle:{color:'#1E5FA8'}},
        {name:'本期广告',type:'bar',data:dates.map(d=>+A[d].a.toFixed(2)),itemStyle:{color:'#D4A017'}},
        {name:'去年同期销售',type:'line',smooth:true,data:dates.map(d=>{
          const k=d.replace(String(year),String(py));return B[k]?+B[k].s.toFixed(2):null}),itemStyle:{color:'#7E8C99'}}
      ]
    });
  };

  /* ============ 5. 待办事项 ============ */
  P.tasks=async root=>{
    const tasks=await DB.all('tasks');
    const f=App.state.taskFilter||'open';
    const list=tasks.filter(t=>f==='all'?true:(f==='done'?t.done:!t.done));
    const lv={红:'red',黄:'yellow',绿:'green'};
    root.innerHTML=
      `<div class="card"><h3>待办事项</h3>
        <div class="sub">诊断异常、巡检异常、节点提醒都可转为待办事项；完成后回写，形成处置闭环</div>
        <div class="toolbar">
          <select id="tFilter" class="mini">${[['open','未完成'],['done','已完成'],['all','全部']].map(([v,t])=>`<option value="${v}" ${v===f?'selected':''}>${t}</option>`).join('')}</select>
          <button class="btn" id="tAdd">新增待办</button>
        </div>`+
      U.table({cols:[
        {t:'级别',k:'priority',f:r=>U.dot(lv[r.priority]||'gray')+' '+U.esc(r.priority||'')},
        {t:'来源',k:'source'},
        {t:'事项',k:'title'},
        {t:'截止',k:'dueDate',f:r=>{
          const d=U.diffDays(r.dueDate,U.today());
          if(r.done) return U.esc(r.dueDate||'—');
          if(d<0) return U.esc(r.dueDate)+' '+U.tag('逾期','red');
          if(d<=3) return U.esc(r.dueDate)+' '+U.tag(`剩${d}天`,'yellow');
          return U.esc(r.dueDate||'—');
        }},
        {t:'状态',k:'done',f:r=>r.done?U.tag('已完成','green'):U.tag('待处理','gray')}
      ],rows:list,empty:'暂无待办',
      actions:r=>`<button class="btn-ghost btn-sm" data-tg="${r.id}">${r.done?'撤销':'完成'}</button>
        <button class="btn-ghost btn-sm" data-del="${r.id}">删除</button>`})+`</div>`;
    root.querySelector('#tFilter').onchange=e=>{App.state.taskFilter=e.target.value;App.refresh()};
    root.querySelector('#tAdd').onclick=()=>{
      U.modal({title:'新增待办',body:U.formFields([
        {k:'title',t:'事项'},{k:'source',t:'来源',type:'select',opts:['手动','诊断','巡检','节点'].map(v=>({v,t:v}))},
        {k:'priority',t:'优先级',type:'select',opts:['红','黄','绿'].map(v=>({v,t:v}))},
        {k:'dueDate',t:'截止日期',type:'date',def:U.today()}
      ]),onOk:async b=>{const v=U.formValues(b);v.done=false;await DB.put('tasks',v)},after:()=>App.refresh()});
    };
    root.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{
      const t=await DB.get('tasks',Number(b.dataset.tg)); t.done=!t.done;
      t.doneDate=t.done?U.today():null; await DB.put('tasks',t); App.refresh();
    });
    root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      U.confirmBox('删除该待办？',async()=>{await DB.del('tasks',Number(b.dataset.del));App.refresh()});
    });
  };

  window.Pages=Object.assign(window.Pages||{},P);
  window.Anomalies=anomalies;
})();

</script>
<script>
/* js/mod-operate.js */
(function(){
  const P={}; const U=window.UI, DB=window.DB;
  const nf={t:'—',f:()=>'—'};

  async function pm(){const ps=await DB.all('products');const m={};ps.forEach(p=>m[p.id]=p);return m}
  async function sm(){const ss=await DB.all('stores');const m={};ss.forEach(s=>m[s.id]=s);return m}

  /* ============ 6. 诊断中心 ============ */
  const TABS=[['ads','广告诊断'],['profit','单品利润诊断'],['listing','Listing诊断'],['inventory','库存风险诊断'],['account','账户健康诊断']];
  P.diagnosis=async root=>{
    const tab=App.state.diagTab||'ads';
    const prods=(await DB.all('products')).filter(p=>App.inScope(p.storeId));
    const PM=await pm(), SM=await sm();
    const ads=await DB.all('ads'), invs=await DB.all('inventory'), ls=await DB.all('listings');
    const avg=await U.dailyAvgMap();
    const r=U.R(); const rows=[];
    if(tab==='ads'){
      ads.filter(a=>App.inScope(a.storeId)).forEach(a=>{
        const p=PM[a.productId]; if(!p) return;
        const pf=U.profit(p); const be=pf.breakEvenAcos;
        const acos=a.sales?a.spend/a.sales*100:null;
        const share=a.spend&&Number(a.dailyBudget)?a.spend/a.dailyBudget*100:null;
        let lv='green',txt='ACOS 在保本线内';
        if(acos==null){lv='gray';txt='缺少销售数据，无法判断'}
        else if(acos>be){lv='red';txt=`ACOS ${acos.toFixed(1)}% > 保本 ${be.toFixed(1)}%，每单亏损`}
        else if(acos>be*0.8){lv='yellow';txt=`ACOS ${acos.toFixed(1)}% 接近保本线 ${be.toFixed(1)}%`}
        if(a.sales===0&&a.spend>0){lv='yellow';txt='有花费无产出，检查关键词与竞价'}
        rows.push({obj:a,level:lv,target:`${p.sku} ${a.name}`,text:txt,
          detail:`花费 $${U.f2(a.spend)} · 销售 $${U.f2(a.sales)} · 预算使用 ${share==null?'—':share.toFixed(0)+'%'}`,link:'ads'});
      });
    }else if(tab==='profit'){
      prods.forEach(p=>{
        const pf=U.profit(p); const lv=U.marginColor(pf.margin);
        rows.push({obj:p,level:lv,target:`${p.sku} ${p.name}`,
          text:`净利率 ${pf.margin==null?'—':pf.margin.toFixed(1)}%（目标 >${r.marginYellow}%）`,
          detail:`售价 $${U.f2(pf.price)} · 总成本 $${U.f2(pf.total)} · 净利 $${U.f2(pf.net)} · 保本ACOS ${pf.breakEvenAcos==null?'—':pf.breakEvenAcos.toFixed(1)}%`,link:'products'});
      });
    }else if(tab==='listing'){
      ls.forEach(l=>{
        const p=PM[l.productId]; if(!p||!App.inScope(p.storeId)) return;
        let score=0; score+=l.title&&l.title.length>40?25:10; score+=(Number(l.bullets)||0)>=5?25:(Number(l.bullets)||0)*4;
        score+=(Number(l.images)||0)>=7?25:(Number(l.images)||0)*3; score+=Number(l.aPlus)?15:0;
        score+=l.keywords?10:0;
        const lv=score>=85?'green':(score>=60?'yellow':'red');
        rows.push({obj:l,level:lv,target:`${p.sku} ${p.name}`,
          text:`健康分 ${score}/100`,
          detail:`五点 ${l.bullets||0}/5 · 图片 ${l.images||0}/7 · A+ ${Number(l.aPlus)?'有':'无'} · 关键词 ${l.keywords?'已填':'未填'}`,link:'listing'});
      });
    }else if(tab==='inventory'){
      invs.forEach(i=>{
        const p=PM[i.productId]; if(!p||!App.inScope(p.storeId)) return;
        const daily=avg[i.productId]!=null?avg[i.productId]:(Number(i.dailySalesAvg)||0);
        const avail=(Number(i.fbaQty)||0)+(Number(i.inboundQty)||0)-(Number(i.reserveQty)||0);
        const cover=daily>0?avail/daily:null;
        let lv='green',txt='库存健康';
        if(cover==null){lv='gray';txt='缺少日均销量'}
        else if(cover<r.stockRed){lv='red';txt=`可售 ${cover.toFixed(0)} 天，最晚补货 ${U.addDays(U.today(),Math.max(0,Math.floor(cover)-(Number(i.leadDays)||0)))}`}
        else if(cover<r.stockYellow){lv='yellow';txt=`可售 ${cover.toFixed(0)} 天，需安排补货`}
        if((Number(i.aging180)||0)>0){lv='red';txt+=` · 库龄>180天 ${i.aging180} 件`}
        rows.push({obj:i,level:lv,target:`${p.sku} ${p.name}`,text:txt,
          detail:`FBA ${i.fbaQty||0} · 在途 ${i.inboundQty||0} · 预留 ${i.reserveQty||0} · 日均 ${daily} · 周期 ${i.leadDays||0} 天`,link:'inventory'});
      });
    }else{
      (await DB.all('stores')).filter(s=>App.inScope(s.id)).forEach(s=>{
        const ach=Number(s.ach);
        const lv=(s.status&&s.status!=='正常')?'red':(ach&&ach<200?'yellow':'green');
        rows.push({obj:s,level:lv,target:s.name,
          text:`状态 ${s.status||'正常'} · ACH ${ach||'—'} · 绩效通知 ${s.notices||0}`,
          detail:`站点 ${s.site} · ${s.note||''}`,link:'stores'});
      });
    }
    const order={red:0,yellow:1,green:2,gray:3};

    root.innerHTML=
      `<div class="card"><h3>诊断中心</h3>

        </div>
        <table><thead><tr><th style="width:60px">级别</th><th>对象</th><th>结论</th><th>明细</th><th style="width:150px">操作</th></tr></thead>

          <td>${U.dot(x.level)}</td><td>${U.esc(x.target)}</td><td>${U.esc(x.text)}</td>
          <td style="color:var(--ink2);font-size:12px">${U.esc(x.detail)}</td>
          <td><button class="btn-ghost btn-sm" data-t="${U.esc(x.target+'：'+x.text)}" data-l="${x.level}">转待办</button>

      </div>

    root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{App.state.diagTab=b.dataset.tab;App.refresh()});
    root.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{
      const lv=b.dataset.l==='red'?'红':(b.dataset.l==='yellow'?'黄':'绿');

      U.toast('已转为待办');

    root.querySelector('#dSave').onclick=async()=>{
      await DB.put('diagnosis_log',{type:tab,date:U.today(),
        findings:rows.map(x=>({level:x.level,target:x.target,text:x.text})),
        score:Math.round(rows.filter(x=>x.level==='green').length/Math.max(1,rows.length)*100),
        followUpTaskIds:[]});
      U.toast('诊断记录已保存'); App.refresh();
    };
    const hist=(await DB.all('diagnosis_log')).filter(h=>h.type===tab).sort((a,b)=>a.date<b.date?1:-1).slice(0,8);

      :`<div class="empty">暂无诊断记录，点击「保存本轮诊断记录」开始积累</div>`;

  /* ============ 10. 广告管理 ============ */
  P.ads=async root=>{
    U.clearCharts();
    const PM=await pm();
    const ads=(await DB.all('ads')).filter(a=>App.inScope(a.storeId));
    const rows=ads.map(a=>{
      const p=PM[a.productId]||{}; const pf=p.price?U.profit(p):null;
      return Object.assign({},a,{_acos:a.sales?a.spend/a.sales*100:null,
        _be:pf?pf.breakEvenAcos:null,_ctr:(a.clicks&&a.impressions)?a.clicks/a.impressions*100:null,
        _cpc:(a.clicks&&a.spend)?a.spend/a.clicks:null,_sku:p.sku||'—'});
    });
    rows.sort((a,b)=>(b.spend||0)-(a.spend||0));
    const waste=rows.filter(r=>r.spend>0&&(!r.sales||r.sales===0));
    root.innerHTML=
      U.kpi([

  /* ============ 11. 库存与履约 ============ */
  P.inventory=async root=>{
    const PM=await pm(), r=U.R();
    const invs=(await DB.all('inventory')).filter(i=>PM[i.productId]&&App.inScope(PM[i.productId].storeId));
    const plans=await DB.all('ship_plans');
    // 日均销量：优先用 kpi_daily 近 30 天日均订单动态计算；无销售数据时才回退到录入兜底值
    const avg=await U.dailyAvgMap();
    const rows=invs.map(i=>{
      const dyn = avg[i.productId]!=null ? avg[i.productId] : (Number(i.dailySalesAvg)||0);
      const avail=(Number(i.fbaQty)||0)+(Number(i.inboundQty)||0)-(Number(i.reserveQty)||0);
      const cover=dyn>0?avail/dyn:null;
      const need=dyn*(Number(i.leadDays)||0)*1.2;
      return Object.assign({},i,{_sku:PM[i.productId].sku,_avail:avail,_cover:cover,_daily:dyn,_dyn:avg[i.productId]!=null,
        _lastOrder:cover==null?'—':U.addDays(U.today(),Math.max(0,Math.floor(cover)-(Number(i.leadDays)||0))),
        _suggest:Math.max(0,Math.round(need-avail))});
    });
    root.innerHTML=
      U.kpi([
        {label:'断货风险 SKU',value:String(rows.filter(x=>x._cover!=null&&x._cover<r.stockRed).length),level:'alert'},
        {label:'预警区间 SKU',value:String(rows.filter(x=>x._cover!=null&&x._cover>=r.stockRed&&x._cover<r.stockYellow).length),level:'warn'},
        {label:'在途件数',value:U.f0(rows.reduce((a,b)=>a+(Number(b.inboundQty)||0),0))},
        {label:'库龄>180 天',value:U.f0(rows.reduce((a,b)=>a+(Number(b.aging180)||0),0)),level:'alert'}
      ])+
      `<div class="card"><h3>库存台账与补货计算</h3>
        <div class="sub">可售天数 = (FBA + 在途 - 预留) / 日均销量；建议补货量按补货周期 × 1.2 安全系数。日均销量取自近 30 天日均订单，每日自动更新（kpi_daily 无数据时才用录入兜底值）</div>
        <div class="toolbar"><button class="btn" id="iAdd">新增库存记录</button>
          <button class="btn-ghost" id="iCsv">导出 CSV</button></div>`+
      U.table({cols:[
        {t:'SKU',k:'_sku'},{t:'FBA',k:'fbaQty',num:true},{t:'在途',k:'inboundQty',num:true},
        {t:'预留',k:'reserveQty',num:true},{t:'日均(近30天)',num:true,f:x=>`${(Number(x._daily)||0).toFixed(1)}${x._dyn?'':' (兜底)'}`,num:true},
        {t:'可售天数',num:true,f:x=>x._cover==null?'—':x._cover.toFixed(0)+' 天 '+U.dot(x._cover<r.stockRed?'red':(x._cover<r.stockYellow?'yellow':'green'))},
        {t:'最晚补货',f:x=>U.esc(x._lastOrder)},{t:'建议补货',num:true,f:x=>U.f0(x._suggest)},
        {t:'库龄90/180',f:x=>`${x.aging90||0} / ${x.aging180||0}`}
      ],rows,empty:'暂无库存数据',
      actions:x=>`<button class="btn-ghost btn-sm" data-e="${x.id}">编辑</button>`})+`</div>
      <div class="grid g2">
        <div class="card"><h3>入仓计划</h3>
          <div class="sub">旺季按节点倒推入仓；系统记计划与差异，物流执行由你安排</div>
          <div class="toolbar"><button class="btn" id="spAdd">新增入仓计划</button></div>`+
          U.table({cols:[{t:'计划名',k:'name'},{t:'发货日',k:'shipDate'},{t:'预计到仓',k:'etaDate'},
            {t:'件数',k:'qty',num:true},{t:'状态',k:'status'},{t:'接收差异',k:'diff',num:true}],
            rows:plans,empty:'暂无入仓计划',
            actions:x=>`<button class="btn-ghost btn-sm" data-spd="${x.id}">删除</button>`})+`</div>
        <div class="card"><h3>库龄与长期仓储费</h3>
          <div class="sub">库龄 >180 天即长期仓储费风险；优先清仓或提报促销</div>
          <div id="cAge" class="chart"></div></div>
      </div>`;
    const ifields=[{k:'productId',t:'产品',type:'select',opts:Object.values(PM).map(p=>({v:p.id,t:p.sku}))},
      {k:'fbaQty',t:'FBA 可售',type:'number'},{k:'inboundQty',t:'在途',type:'number'},
      {k:'reserveQty',t:'预留',type:'number'},{k:'dailySalesAvg',t:'日均销量兜底(近30天有数据时不生效)',type:'number',step:'0.1'},
      {k:'leadDays',t:'补货周期(天)',type:'number'},{k:'aging90',t:'库龄>90天件数',type:'number'},
      {k:'aging180',t:'库龄>180天件数',type:'number'}];
    root.querySelector('#iAdd').onclick=()=>U.modal({title:'新增库存记录',body:U.formFields(ifields),
      onOk:async b=>{await DB.put('inventory',U.formValues(b))},after:()=>App.refresh()});
    root.querySelector('#iCsv').onclick=()=>U.exportCSV('commander_inventory.csv',
      rows.map(x=>({SKU:x._sku,FBA:x.fbaQty,在途:x.inboundQty,预留:x.reserveQty,日均:x._daily,
        可售天数:x._cover==null?'':Math.round(x._cover),最晚补货:x._lastOrder,建议补货:x._suggest,
        库龄90:x.aging90||0,库龄180:x.aging180||0})),
      ['SKU','FBA','在途','预留','日均','可售天数','最晚补货','建议补货','库龄90','库龄180']);
    root.querySelectorAll('[data-e]').forEach(x=>x.onclick=async()=>{
      const i=await DB.get('inventory',Number(x.dataset.e));
      U.modal({title:'编辑库存',body:U.formFields(ifields,i),onOk:async b=>{
        const v=U.formValues(b);v.id=i.id;await DB.put('inventory',v)},after:()=>App.refresh()});
    });
    root.querySelector('#spAdd').onclick=()=>U.modal({title:'新增入仓计划',body:U.formFields([
      {k:'name',t:'计划名称'},{k:'shipDate',t:'发货日',type:'date'},
      {k:'etaDate',t:'预计到仓',type:'date'},{k:'qty',t:'件数',type:'number'},
      {k:'status',t:'状态',type:'select',opts:['待发货','在途','已到仓','接收中'].map(v=>({v,t:v}))},
      {k:'diff',t:'接收差异',type:'number'}
    ]),onOk:async b=>{await DB.put('ship_plans',U.formValues(b))},after:()=>App.refresh()});
    root.querySelectorAll('[data-spd]').forEach(x=>x.onclick=()=>U.confirmBox('删除该计划？',
      async()=>{await DB.del('ship_plans',Number(x.dataset.spd));App.refresh()}));
    U.chart(document.getElementById('cAge'),{
      tooltip:{trigger:'axis'},legend:{data:['库龄>90','库龄>180'],top:0},
      grid:{left:60,right:20,top:30,bottom:30},
      xAxis:{type:'category',data:rows.map(x=>x._sku)},yAxis:{type:'value'},
      series:[{name:'库龄>90',type:'bar',stack:'a',data:rows.map(x=>Number(x.aging90)||0),itemStyle:{color:'#D4A017'}},
        {name:'库龄>180',type:'bar',stack:'a',data:rows.map(x=>Number(x.aging180)||0),itemStyle:{color:'#C0392B'}}]
    });
  };

      U.kpi([

        {label:'待索赔金额',value:U.money(claims.filter(c=>!c.claimed).reduce((a,b)=>a+(Number(b.amount)||0),0)),level:'warn'},
        {label:'已索赔',value:U.money(claims.filter(c=>c.claimed).reduce((a,b)=>a+(Number(b.amount)||0),0))}

      `<div class="grid g2">
        <div class="card"><h3>退货记录</h3>

        <div class="card"><h3>FBA 丢失损坏索赔</h3>

      {k:'resolved',t:'已处理',type:'select',opts:[{v:0,t:'否'},{v:1,t:'是'}]}

      async()=>{await DB.del('returns',Number(x.dataset.rd));App.refresh()}));

      {k:'type',t:'类型',type:'select',opts:['仓内丢失','仓内损坏','客户退货未入库','多收仓储费'].map(v=>({v,t:v}))},
      {k:'date',t:'发生日',type:'date',def:U.today()},{k:'qty',t:'件数',type:'number'},

        4. 含 SKU/ASIN 列时可按产品匹配，否则归属到下方所选店铺<br>
        5. 导入为追加写入，相同日期相同产品会被覆盖更新
      </div>
    </div>`;
    let parsed=[];

2026-09-01,1200,72,2150.40,320.50,980.20,3
2026-09-02,1310,80,2380.10,340.00,1102.30,2</pre>`});

      const f=e.target.files[0]; if(!f) return;
      root.querySelector('#iText').value=await readFile(f);
    };
    root.querySelector('#iParse').onclick=async()=>{
      const storeList=await DB.all('stores');
      const txt=root.querySelector('#iText').value;
      if(!txt.trim()){U.toast('请先粘贴或选择文件');return}
      parsed=U.parseCSV(txt);
      if(!parsed.length){U.toast('解析结果为空');return}
      const headers=Object.keys(parsed[0]);
      const fields=IMPORT_TARGETS[tgt].fields;
      const box=root.querySelector('#iMap');
      box.innerHTML=`<div class="card" style="background:#EFF5FB">
        <h3>字段映射（共 ${parsed.length} 行）</h3>
        <div class="grid g3">${fields.map(f=>`
          <label class="f">${f}
            <select name="map_${f}" style="margin-top:4px">
              <option value="">— 不导入 —</option>
              ${headers.map(h=>`<option value="${U.esc(h)}" ${h.toLowerCase()===f.toLowerCase()?'selected':''}>${U.esc(h)}</option>`).join('')}
            </select></label>`).join('')}
          <label class="f">产品匹配列（SKU/ASIN）
            <select name="matchCol" style="margin-top:4px">
              <option value="">— 归属所选店铺 —</option>
              ${headers.map(h=>`<option value="${U.esc(h)}">${U.esc(h)}</option>`).join('')}
            </select></label>

            </select></label>
          <label class="f">日期列（如报告含日期）
            <select name="dateCol" style="margin-top:4px">
              <option value="">— 用今天 —</option>
              ${headers.map(h=>`<option value="${U.esc(h)}" ${/date|日期/i.test(h)?'selected':''}>${U.esc(h)}</option>`).join('')}
            </select></label>
        </div>
        <div class="toolbar" style="margin-top:12px"><button class="btn" id="iRun">确认导入 ${parsed.length} 行</button></div>
      </div>`;
      box.querySelector('#iRun').onclick=async()=>{
        const sel=box.querySelectorAll('select');
        const map={},extra={};
        sel.forEach(s=>{
          if(s.name.startsWith('map_')) map[s.name.slice(4)]=s.value;
          else extra[s.name]=s.value;
        });
        const skuIdx={};
        Object.values(PM).forEach(p=>{if(p.sku)skuIdx[String(p.sku).toLowerCase()]=p.id;
          if(p.asin)skuIdx[String(p.asin).toLowerCase()]=p.id});
        let ok=0,skip=0;
        for(const row of parsed){
          const o={};
          let matched=null;
          if(extra.matchCol){ const key=String(row[extra.matchCol]||'').toLowerCase(); matched=skuIdx[key]||null }
          if(matched){ o.productId=matched; const p=PM[matched]; if(p)o.storeId=p.storeId }
          else { o.storeId=Number(extra.fallbackStore)||null; if(!o.storeId){skip++;continue} }
          if(extra.dateCol&&row[extra.dateCol]) o.date=String(row[extra.dateCol]).slice(0,10);
          else o.date=U.today();
          Object.keys(map).forEach(f=>{
            if(!map[f]) return;
            let v=row[map[f]];
            if(v!=null&&v!=='') v=String(v).replace(/[$,%\s]/g,'');
            o[f]=(v===''||v==null)?null:(isNaN(Number(v))?v:Number(v));
          });
          await DB.put(tgt,o); ok++;
        }
        U.toast(`导入完成：成功 ${ok} 行，跳过 ${skip} 行`);
        App.refresh();
